[core]
copyFrom: _hyper_relay_common.ini
name: rsHyperRelayB
displayText: 超空间中继 B
displayDescription: 在航道出口 B 附近建设；本队中继 A 完工后，可双向投送附近舰船。
tags: rsHyperRelayB

[placementRule_nearExitB]
searchTags: rsQuantumExitB
searchTeam: any
searchDistance: 60
excludeNonBuildings: false
minCount: 1
blocksPlacement: true
checkEachTile: false
cannotPlaceMessage: 只能在专用地图的航道出口 B 附近建设

[action_launchToA]
text: 中继投送至 A
description: 将附近至多 8 艘本队舰船送到本队中继 A。
price: credits=300, strategic=1
buildSpeed: 2s
displayType: action
takeResources: credits=0
takeResources_includeUnitsWithinRange: 140
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsQuantumFleet
takeResources_searchOnly: true
takeResources_maxUnits: 8
takeResources_triggerActionForEach: sendToA
addActionCooldownTime: 30s
isLocked: if globalSearchForFirstUnit(withTag='rsHyperRelayA', relation='own') == null
isLockedMessage: 需要本队的中继 A

[hiddenAction_sendToA]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsQuantumLaunch
sendMessageWithData: exit=globalSearchForFirstUnit(withTag='rsHyperRelayA', relation='own')

[graphics]
image: hyper_relay.png
image_wreak: hyper_relay_dead.png
