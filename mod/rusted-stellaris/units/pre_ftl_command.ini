[core]
name: rsPreFtlCommand
overrideAndReplace: commandCenter
tags: rsCapital
class: CustomUnitMetadata
displayText: 指挥中心
displayDescription: 前超光速文明的首都。选择帝国类型后在原址升级为恒星基地。
price: 4000
maxHp: 9000
mass: 10000
radius: 30
isBio: false
isBuilding: true
isPickableStartingUnit: true
buildSpeed: 0.0005
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
generation_resources: credits=18, minerals=1
canBuild_1_name: builder
canBuild_1_pos: 1
canBuild_2_name: setRally
canBuild_2_pos: 0.1

[action_researchFTL]
text: 研究超光速理论
description: 完成进入星际时代的基础研究。
price: credits=3000, minerals=100
buildSpeed: 45s
displayType: upgrade
addGlobalTeamTags: rsTechFTL
isVisible: if not self.globalTeamTags(includes='rsTechFTL')
ai_isHighPriority: true

[action_regular]
text: 发展为常规星际帝国
description: 需要超光速理论；消耗 5000 能量币及 150 矿物，升级为恒星基地。
price: credits=5000, minerals=150
buildSpeed: 90s
displayType: upgrade
isLocked: if not self.globalTeamTags(includes='rsTechFTL')
isLockedMessage: 需要超光速理论
addGlobalTeamTags: rsFactionRegular
convertTo: rsStarbase
ai_isHighPriority: true

[action_machine]
text: 发展为机械智能
price: credits=5000, minerals=150
buildSpeed: 90s
displayType: upgrade
isLocked: if not self.globalTeamTags(includes='rsTechFTL')
isLockedMessage: 需要超光速理论
addGlobalTeamTags: rsFactionMachine
convertTo: rsStarbaseMachine
ai_isHighPriority: false

[action_hive]
text: 发展为蜂巢思维
price: credits=5000, minerals=150
buildSpeed: 90s
displayType: upgrade
isLocked: if not self.globalTeamTags(includes='rsTechFTL')
isLockedMessage: 需要超光速理论
addGlobalTeamTags: rsFactionHive
convertTo: rsStarbaseHive
ai_isHighPriority: false

[graphics]
