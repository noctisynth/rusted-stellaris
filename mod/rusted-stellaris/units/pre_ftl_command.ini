ai_isHighPriority: true

[action_regular]
text: Develop into a Regular Interstellar Empire
text_zh: 发展为常规星际帝国
text_en: Develop into a Regular Interstellar Empire
description: Requires Faster-Than-Light Theory. Spends 5000 Energy Credits and 150 Minerals to upgrade to a Starbase.
description_zh: 需要超光速理论，消耗 5000 能量币及 150 矿物，升级为恒星基地。
description_en: Requires Faster-Than-Light Theory. Spends 5000 Energy Credits and 150 Minerals to upgrade to a Starbase.
price: credits=5000, minerals=150
buildSpeed: 90s
displayType: upgrade
