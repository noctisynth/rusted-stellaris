[action_researchFTL]
tags: rsFtlResearch
text: Research Faster-Than-Light Theory
text_zh: 研究超光速理论
text_en: Research Faster-Than-Light Theory
description: Completes the basic research needed to enter the interstellar age.
description_zh: 完成进入星际时代的基础研究。
description_en: Completes the basic research needed to enter the interstellar age.
price: credits=3000, minerals=100
buildSpeed: 45s
