# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: _building_t2_common.ini
name: rsTianjiInstitute
tags: rsTianjiInstitute, rsEconomicTarget
displayText: Institute of Celestial Secrets
displayText_zh: 天机研究所
displayText_en: Institute of Celestial Secrets
displayDescription: Attempts to decipher Fallen Empire ship technology every 180 seconds, with a 90% failure chance. Success unlocks one unowned technology. Attempts stop once all are unlocked.
displayDescription_zh: 每隔 180 秒尝试突破失落帝国舰船科技，90% 失败。成功时获得一项尚未拥有的科技，全部解锁后停止尝试。
displayDescription_en: Attempts to decipher Fallen Empire ship technology every 180 seconds, with a 90% failure chance. Success unlocks one unowned technology. Attempts stop once all are unlocked.
price: credits=6000, alloys=300, science=500, strategic=20
maxHp: 2200
techLevel: 3
buildSpeed: 90s
radius: 27
defineUnitMemory: float roll, float escortWeight, float battleWeight, float titanWeight, float pick

[hiddenAction_beginResearch]
autoTriggerOnEvent: completeAndActive
temporarilyAddTags: rsTianjiOnline
resetCustomTimer: true

[hiddenAction_attemptDiscovery]
autoTrigger: if self.tags(includes='rsTianjiOnline') and self.customTimer>180 and (not self.globalTeamTags(includes='rsTechRiddleEscort') or not self.globalTeamTags(includes='rsTechEnigmaBattlecruiser') or not self.globalTeamTags(includes='rsTechFallenTitan'))
resetCustomTimer: true
setUnitMemory: roll=rnd(0,1), escortWeight=select(self.globalTeamTags(includes='rsTechRiddleEscort'),0,1), battleWeight=select(self.globalTeamTags(includes='rsTechEnigmaBattlecruiser'),0,1), titanWeight=select(self.globalTeamTags(includes='rsTechFallenTitan'),0,1)
alsoTriggerAction: resolveDiscovery

[hiddenAction_resolveDiscovery]
setUnitMemory: pick=memory.roll*10*(memory.escortWeight+memory.battleWeight+memory.titanWeight)
alsoTriggerAction: discoveryFailed, discoverEscort, discoverBattlecruiser, discoverTitan

[hiddenAction_discoveryFailed]
requireConditional: if memory.roll>=0.1
showMessageToPlayer: Institute of Celestial Secrets: this attempt failed to unravel the mysteries of Fallen Empire technology. The research teams will keep trying.
showMessageToPlayer_zh: 天机研究所：本轮未能突破失落帝国的技术谜题。研究团队将继续尝试。
showMessageToPlayer_en: Institute of Celestial Secrets: this attempt failed to unravel the mysteries of Fallen Empire technology. The research teams will keep trying.

[hiddenAction_discoverEscort]
requireConditional: if memory.roll<0.1 and memory.escortWeight==1 and memory.pick<1
addGlobalTeamTags: rsTechRiddleEscort
showMessageToPlayer: Breakthrough at the Institute of Celestial Secrets: Riddle Escort hulls unlocked! Shipyards, Mega Shipyards and Juggernauts can now build this Fallen Empire screening ship.
showMessageToPlayer_zh: 天机研究所取得突破：密语护航舰舰体已解锁！造船厂、巨型船坞和主宰现在可以建造这种失落帝国屏卫舰。
showMessageToPlayer_en: Breakthrough at the Institute of Celestial Secrets: Riddle Escort hulls unlocked! Shipyards, Mega Shipyards and Juggernauts can now build this Fallen Empire screening ship.

[hiddenAction_discoverBattlecruiser]
requireConditional: if memory.roll<0.1 and memory.battleWeight==1 and memory.pick>=memory.escortWeight and memory.pick<memory.escortWeight+1
addGlobalTeamTags: rsTechEnigmaBattlecruiser
showMessageToPlayer: Breakthrough at the Institute of Celestial Secrets: Enigma Battlecruiser hulls unlocked! Shipyards, Mega Shipyards and Juggernauts can now build this twin-cannon capital ship.
showMessageToPlayer_zh: 天机研究所取得突破：神秘战巡舰舰体已解锁！造船厂、巨型船坞和主宰现在可以建造这种双重炮主力舰。
showMessageToPlayer_en: Breakthrough at the Institute of Celestial Secrets: Enigma Battlecruiser hulls unlocked! Shipyards, Mega Shipyards and Juggernauts can now build this twin-cannon capital ship.

[hiddenAction_discoverTitan]
requireConditional: if memory.roll<0.1 and memory.titanWeight==1 and memory.pick>=memory.escortWeight+memory.battleWeight
addGlobalTeamTags: rsTechFallenTitan
showMessageToPlayer: Breakthrough at the Institute of Celestial Secrets: Fallen Empire Titan hulls unlocked! Shipyards, Mega Shipyards and Juggernauts can now build this ancient flagship.
showMessageToPlayer_zh: 天机研究所取得突破：失落帝国泰坦舰体已解锁！造船厂、巨型船坞和主宰现在可以建造这种远古旗舰。
showMessageToPlayer_en: Breakthrough at the Institute of Celestial Secrets: Fallen Empire Titan hulls unlocked! Shipyards, Mega Shipyards and Juggernauts can now build this ancient flagship.

[graphics]
image: tianji_institute.png
image_wreak: tianji_institute_dead.png
scaleImagesTo: 64

[ai]
buildPriority: 0.12
maxEachBase: 1
maxGlobal: 1
