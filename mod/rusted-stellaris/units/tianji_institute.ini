[core]
copyFrom: _building_t2_common.ini
name: rsTianjiInstitute
tags: rsTianjiInstitute, rsEconomicTarget
displayText: 天机研究所
displayDescription: 每隔 180 秒尝试突破失落帝国舰船科技，90% 失败。成功时获得一项尚未拥有的科技，全部解锁后停止尝试。
price: credits=6000, alloys=300, science=500, strategic=20
maxHp: 2200
techLevel: 3
buildSpeed: 90s
radius: 27
defineUnitMemory: float roll, float escortWeight, float battleWeight, float titanWeight, float pick

[hiddenAction_beginResearch]
autoTriggerOnEvent: completeAndActive
temporarilyAddTags: rsTianjiOnline
resetCustomTimer: true

[hiddenAction_attemptDiscovery]
autoTrigger: if self.tags(includes='rsTianjiOnline') and self.customTimer>180 and (not self.globalTeamTags(includes='rsTechRiddleEscort') or not self.globalTeamTags(includes='rsTechEnigmaBattlecruiser') or not self.globalTeamTags(includes='rsTechFallenTitan'))
resetCustomTimer: true
setUnitMemory: roll=rnd(0,1), escortWeight=select(self.globalTeamTags(includes='rsTechRiddleEscort'),0,1), battleWeight=select(self.globalTeamTags(includes='rsTechEnigmaBattlecruiser'),0,1), titanWeight=select(self.globalTeamTags(includes='rsTechFallenTitan'),0,1)
alsoTriggerAction: resolveDiscovery

[hiddenAction_resolveDiscovery]
setUnitMemory: pick=memory.roll*10*(memory.escortWeight+memory.battleWeight+memory.titanWeight)
alsoTriggerAction: discoveryFailed, discoverEscort, discoverBattlecruiser, discoverTitan

[hiddenAction_discoveryFailed]
requireConditional: if memory.roll>=0.1
showMessageToPlayer: 天机研究所：本轮未能突破失落帝国的技术谜题。研究团队将继续尝试。

[hiddenAction_discoverEscort]
requireConditional: if memory.roll<0.1 and memory.escortWeight==1 and memory.pick<1
addGlobalTeamTags: rsTechRiddleEscort
showMessageToPlayer: 天机研究所取得突破：密语护航舰舰体已解锁！造船厂、巨型船坞和主宰现在可以建造这种失落帝国屏卫舰。

[hiddenAction_discoverBattlecruiser]
requireConditional: if memory.roll<0.1 and memory.battleWeight==1 and memory.pick>=memory.escortWeight and memory.pick<memory.escortWeight+1
addGlobalTeamTags: rsTechEnigmaBattlecruiser
showMessageToPlayer: 天机研究所取得突破：神秘战巡舰舰体已解锁！造船厂、巨型船坞和主宰现在可以建造这种双重炮主力舰。

[hiddenAction_discoverTitan]
requireConditional: if memory.roll<0.1 and memory.titanWeight==1 and memory.pick>=memory.escortWeight+memory.battleWeight
addGlobalTeamTags: rsTechFallenTitan
showMessageToPlayer: 天机研究所取得突破：失落帝国泰坦舰体已解锁！造船厂、巨型船坞和主宰现在可以建造这种远古旗舰。

[graphics]
image: tianji_institute.png
image_wreak: tianji_institute_dead.png
scaleImagesTo: 64

[ai]
buildPriority: 0.12
maxEachBase: 1
maxGlobal: 1
