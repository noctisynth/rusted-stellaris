# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: titan.ini
name: rsParadoxTitan
displayText: Paradox Titan
displayText_zh: 悖论泰坦舰
displayText_en: Paradox Titan
displayDescription: An ultimate flagship with heavy shields against capital-ship fire. Its main cannon, twin rapid-fire secondary guns and guided missiles target independently; laser defenses intercept a limited number of missiles.
displayDescription_zh: 终极旗舰，厚重护盾承受主力舰火力，主炮、双联速射副炮与制导导弹分别索敌，激光防御可拦截有限数量的导弹。
displayDescription_en: An ultimate flagship with heavy shields against capital-ship fire. Its main cannon, twin rapid-fire secondary guns and guided missiles target independently; laser defenses intercept a limited number of missiles.
price: credits=20000, alloys=1300, strategic=85, titanPermit=1
maxHp: 24000
maxShield: 20000
shieldRegen: 0.70
shieldRenderRadius: 47
selfRegenRate: 0.25
energyMax: 1
energyRegen: 0.0006
nanoRange: 210
nanoRepairSpeed: 0.45

[hiddenAction_announceCompletion]
@copyFrom_skipThisSection: true
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: A Paradox Titan has completed its refit. Heavy shields and improved naval guns make it a mobile fortress that only the fiercest attacks can shake.
showMessageToAllEnemyPlayers_zh: 一艘悖论泰坦舰完成了改装。厚重护盾与强化舰炮使它宛如一座移动堡垒，只有最猛烈的攻击才能撼动它。
showMessageToAllEnemyPlayers_en: A Paradox Titan has completed its refit. Heavy shields and improved naval guns make it a mobile fortress that only the fiercest attacks can shake.
showMessageToPlayer: Our Paradox Titan's refit is complete. Protected like a mobile fortress, it will endure enemy fire and defend the fleet with its main cannon and escort weapons.
showMessageToPlayer_zh: 悖论泰坦舰的改装已经完成。它将以移动堡垒般的防护承受敌方火力，并以主炮与护航武器守卫舰队。
showMessageToPlayer_en: Our Paradox Titan's refit is complete. Protected like a mobile fortress, it will endure enemy fire and defend the fleet with its main cannon and escort weapons.

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=27600)
setUnitStats: hp=self.hp*27600/self.maxHp, maxHp=27600
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*24000/self.maxHp, maxHp=24000
addResources: unsetFlag=1

[action_upgradeParadoxTitan]
isVisible: false

[attack]
maxAttackRange: 480
shootDelay: 90

[turret_2]
limitingRange: 300
delay: 10

[turret_3]
limitingRange: 300
delay: 10

[turret_laserDefence]
x: 0
y: 0
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.16
limitingRange: 160
size: 1

[projectile_1]
directDamage: 4800

[projectile_3]
directDamage: 200

[graphics]
scaleImagesTo: 96
image: titan.png
image_wreak: titan_dead.png
