[core]
copyFrom: destroyer.ini
name: rsDestroyerKinetic
displayText: 动能驱逐舰
displayDescription: 远距动能炮配合轻型副炮，激光近防消耗储能拦截导弹，范围小于普通驱逐舰。
price: credits=2100, minerals=150, alloys=30
maxHp: 1400

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=1610)
setUnitStats: hp=self.hp*1610/self.maxHp, maxHp=1610
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*1400/self.maxHp, maxHp=1400
addResources: unsetFlag=1

[graphics]
scaleImagesTo: 48
image: destroyer_kinetic.png
image_wreak: destroyer_kinetic_dead.png

[attack]
maxAttackRange: 235
shootDelay: 52

[turret_pd]
limitingRange: 65
laserDefenceEnergyUse: 0.65

[projectile_1]
directDamage: 135
life: 40
instant: false
lightingEffect: false
laserEffect: false
deflectionPower: -1
speed: 10
color: #F2C979
drawSize: 1.4
lightColor: #F2C979
lightSize: 0.2
