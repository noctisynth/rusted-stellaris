# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
name: rsPreFtlMine
overrideAndReplace: extractor
class: CustomUnitMetadata
displayText: Resource Extractor
displayText_zh: 资源抽取器
displayText_en: Resource Extractor
displayDescription: Produces 8 Energy Credits and 2 Minerals at a resource node. Can be upgraded on site into a Mining Station in the interstellar age.
displayDescription_zh: 在资源点产出 8 能量币和 2 矿物，进入星际时代后可原址升级为采矿站。
displayDescription_en: Produces 8 Energy Credits and 2 Minerals at a resource node. Can be upgraded on site into a Mining Station in the interstellar age.
tags: rsPreFtlMine, rsEconomicTarget
price: credits=700
maxHp: 650
mass: 9000
techLevel: 1
buildSpeed: 0.001
radius: 19
isBio: false
isBuilding: true
placeOnlyOnResPool: true
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
generation_resources: credits=8, minerals=2

[action_upgradeMining]
text: Upgrade to Mining Station
text_zh: 升级为采矿站
text_en: Upgrade to Mining Station
description: Upgrades the mining facilities on site and increases Minerals output after entering the interstellar age.
description_zh: 进入星际时代后，在原址升级矿业设施并增加矿物产量。
description_en: Upgrades the mining facilities on site and increases Minerals output after entering the interstellar age.
price: credits=500, minerals=20
buildSpeed: 30s
displayType: upgrade
convertTo: rsMiningStation
isLocked: if not self.globalTeamTags(includes='rsFactionRegular') and not self.globalTeamTags(includes='rsFactionMachine') and not self.globalTeamTags(includes='rsFactionHive')
isLockedMessage: Upgrade the Command Center to a Starbase first.
isLockedMessage_zh: 需要将指挥中心升级为恒星基地
isLockedMessage_en: Upgrade the Command Center to a Starbase first.
ai_isHighPriority: true

[graphics]
total_frames: 1
image: mining_station.png
scaleImagesTo: 48
image_wreak: mining_station_dead.png
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
canAttack: false

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]
buildPriority: 0.40
maxEachBase: 8
