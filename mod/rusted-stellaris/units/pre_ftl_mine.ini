[core]
name: rsPreFtlMine
overrideAndReplace: extractor
class: CustomUnitMetadata
displayText: 资源抽取器
displayDescription: 在资源点产出 8 能量币和 2 矿物；进入星际时代后可原址升级为采矿站。
tags: rsPreFtlMine
price: credits=700
maxHp: 650
mass: 9000
techLevel: 1
buildSpeed: 0.001
radius: 19
isBio: false
isBuilding: true
placeOnlyOnResPool: true
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
generation_resources: credits=8, minerals=2

[action_upgradeMining]
