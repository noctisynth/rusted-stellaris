showMessageToAllPlayers_zh: 三臂-02 · 西环的地壳已经破裂，磁层也在分解。我们很难理解一颗星球死亡时的壮烈，但当它炽热的核心开始在冰冷宇宙中冷却，那种死亡之美无可争辩。
showMessageToAllPlayers_en: The crust of Arms-02 · West Ring has fractured, and its magnetosphere is disintegrating. The spectacle of a world's death is difficult to comprehend, yet as its searing core cools in the cold of space, the beauty of that death is undeniable.
