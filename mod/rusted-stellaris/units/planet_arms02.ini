[core]
copyFrom: planet_unclaimed.ini
name: rsPlanetArms02
displayText: Arms-02 · West Ring
displayText_zh: 三臂-02 · 西环
displayText_en: Arms-02 · West Ring
displayDescription: Unclaimed planet Arms02. Construction Ships can establish a colony nearby.
