takeResources_triggerActionForEach: purgeColony

[hiddenAction_pacify]
autoTriggerOnEvent: tookDamage(withTag='rsPacifier')
showMessageToAllPlayers: The dazzling light above Arms-02 · West Ring has faded, and the world has fallen silent. History may judge the complete isolation of a planet from the universe to be extreme and unjustifiable. Perhaps it will not. Either way, only a planet-sized crystal sphere remains.
showMessageToAllPlayers_zh: 三臂-02 · 西环上空炫目的光芒已经黯淡，整个世界归于沉寂。也许历史会将这次把一颗行星从大宇宙中完全隔绝的行为视作极端且不合理。也许不会。无论如何，从现在起，这里只剩下一颗行星规模的水晶球。
showMessageToAllPlayers_en: The dazzling light above Arms-02 · West Ring has faded, and the world has fallen silent. History may judge the complete isolation of a planet from the universe to be extreme and unjustifiable. Perhaps it will not. Either way, only a planet-sized crystal sphere remains.
