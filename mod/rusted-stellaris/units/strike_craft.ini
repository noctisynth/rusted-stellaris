[core]
copyFrom: fighter.ini
name: rsStrikeCraft
displayText: 舰载机
displayDescription: 航母巡洋舰投放的攻击艇，用数量和机动持续压制敌舰，不具备导弹近防。
price: credits=186, alloys=10
maxHp: 105
techLevel: 3
buildSpeed: 0.007

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=121)
setUnitStats: hp=self.hp*121/self.maxHp, maxHp=121, shootDamageMultiplier=1.1
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*105/self.maxHp, maxHp=105, shootDamageMultiplier=1
addResources: unsetFlag=1

[graphics]
scaleImagesTo: 32
image: strike_craft.png
image_wreak: strike_craft_dead.png

[attack]
canAttackLandUnits: true
maxAttackRange: 95
shootDelay: 27

[projectile_1]
directDamage: 18
color: #F2C979

[movement]
moveSpeed: 3.5
