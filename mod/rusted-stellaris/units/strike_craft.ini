# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: fighter.ini
name: rsStrikeCraft
displayText: Strike Craft
displayText_zh: 舰载机
displayText_en: Strike Craft
displayDescription: Attack craft deployed by Carrier Cruisers. Uses numbers and mobility to sustain pressure on enemy ships. No missile point defense.
displayDescription_zh: 航母巡洋舰投放的攻击艇，用数量和机动持续压制敌舰，不具备导弹近防。
displayDescription_en: Attack craft deployed by Carrier Cruisers. Uses numbers and mobility to sustain pressure on enemy ships. No missile point defense.
price: credits=186, alloys=10
maxHp: 105
techLevel: 3
buildSpeed: 0.007

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=121)
setUnitStats: hp=self.hp*121/self.maxHp, maxHp=121
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*105/self.maxHp, maxHp=105
addResources: unsetFlag=1

[graphics]
scaleImagesTo: 32
image: strike_craft.png
image_wreak: strike_craft_dead.png

[attack]
canAttackLandUnits: true
maxAttackRange: 95
shootDelay: 27

[projectile_1]
directDamage: 18
color: #F2C979

[movement]
moveSpeed: 3.5
