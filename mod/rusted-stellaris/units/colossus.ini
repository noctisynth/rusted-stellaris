# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
name: rsColossus
class: CustomUnitMetadata
displayText: Colossus
displayText_zh: 巨像
displayText_en: Colossus
displayDescription: An age-four ultimate weapon equipped with the World Cracker, Neutron Sweep and Global Pacifier.
displayDescription_zh: 第四时代终极武器，可发动地爆天星、中子灭杀和安乐天使。
displayDescription_en: An age-four ultimate weapon equipped with the World Cracker, Neutron Sweep and Global Pacifier.
tags: rsColossus
price: credits=20000, alloys=1200, strategic=80, colossusPermit=1
maxHp: 15000
mass: 44000
techLevel: 3
buildSpeed: 0.00019
radius: 46
isBio: false
softCollisionOnAll: 3
energyMax: 1
energyRegen: 0.000185
energyNeedsToRechargeToFull: true
autoTriggerCheckRate: every8Frames

[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: Word has reached us that an empire has completed a Colossus and brought it into service. This weapons platform can destroy an entire planet. The balance of power in the galaxy may have changed forever...
showMessageToAllEnemyPlayers_zh: 我们收到消息，一个帝国已经完成了巨像的建造并投入服役。这是一种足以彻底毁灭行星的武器平台。银河的力量均衡，或许自此改变了……
showMessageToAllEnemyPlayers_en: Word has reached us that an empire has completed a Colossus and brought it into service. This weapons platform can destroy an entire planet. The balance of power in the galaxy may have changed forever...
showMessageToPlayer: Our Colossus has left its assembly platform. The largest weapons platform in our history is now operational. This moment will mark a turning point for our empire.
showMessageToPlayer_zh: 我们的巨像已经离开装配平台。我国历史上最庞大的武器平台现已投入使用，这一刻将成为帝国历史的转折点。
showMessageToPlayer_en: Our Colossus has left its assembly platform. The largest weapons platform in our history is now operational. This moment will mark a turning point for our empire.
temporarilyAddTags: rsColossusAllyNoticePending
resetCustomTimer: true

[hiddenAction_dispatchAllyCompletionNotice]
autoTrigger: if self.tags(includes='rsColossusAllyNoticePending') and self.customTimer>1
temporarilyRemoveTags: rsColossusAllyNoticePending
takeResources: credits=0
takeResources_includeUnitsWithinRange: 99999
takeResources_includeUnitsWithinRange_team: allyNotOwn
takeResources_excludeUnitsWithoutTags: rsNoticeReceiver
takeResources_searchOnly: true
takeResources_maxUnits: 100000
takeResources_triggerActionForEach: sendAllyCompletionNotice

[hiddenAction_sendAllyCompletionNotice]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsAllyColossusCompleted

[hiddenAction_returnPermit]
autoTriggerOnEvent: destroyed
addResources: colossusPermit=1

[action_worldCracker]
text: World Cracker
text_zh: 地爆天星
text_en: World Cracker
description: A planet-killer weapon. A thermal stream heats the atmosphere and detonates the core, shattering the world with the resulting shockwave. Charges for 45 seconds and permanently destroys the target planet.
description_zh: 歼星级武器。热能流将加热行星大气并引爆核心，最终由冲击波将整个世界炸得四分五裂。充能45秒，永久摧毁目标行星。
description_en: A planet-killer weapon. A thermal stream heats the atmosphere and detonates the core, shattering the world with the resulting shockwave. Charges for 45 seconds and permanently destroys the target planet.
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 1
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 1
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_neutronSweep]
text: Neutron Sweep
text_zh: 中子灭杀
text_en: Neutron Sweep
description: A planet-killer weapon. An accelerated neutron plume sweeps the surface, destroying most living tissue. Charges for 45 seconds and clears the colony; the planet can be colonized again.
description_zh: 歼星级武器。加速的中子辐射羽流将扫过行星表面，摧毁绝大多数生命组织。充能45秒，清除殖民地，行星仍可再次殖民。
description_en: A planet-killer weapon. An accelerated neutron plume sweeps the surface, destroying most living tissue. Charges for 45 seconds and clears the colony; the planet can be colonized again.
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 2
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 2
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_pacifier]
text: Global Pacifier
text_zh: 安乐天使
text_en: Global Pacifier
description: A planet-killer weapon. Encloses a world in a permanent, impenetrable shield, cutting it off from the galaxy forever. Charges for 45 seconds and permanently seals the target planet.
description_zh: 歼星级武器。在行星周围部署永久且不可逾越的屏蔽场，使整个世界与银河永远隔绝。充能45秒，永久封存目标行星。
description_en: A planet-killer weapon. Encloses a world in a permanent, impenetrable shield, cutting it off from the galaxy forever. Charges for 45 seconds and permanently seals the target planet.
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 3
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 3
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_worldCrackerGround]
text: World Cracker
text_zh: 地爆天星
text_en: World Cracker
description: Projects the World Cracker's thermal stream into the target area for a devastating nuclear-style strike. Does not permanently alter map terrain.
description_zh: 对指定区域投射地爆天星的热能流，造成毁灭性的核爆式打击。不会永久改变地图地形。
description_en: Projects the World Cracker's thermal stream into the target area for a devastating nuclear-style strike. Does not permanently alter map terrain.
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 4
showMessageToAllEnemyPlayers: The World Cracker's thermal stream cuts across the sky. The atmosphere burns and the surface breaks under the impact. Even in this small corner of a planet, the end has come.
showMessageToAllEnemyPlayers_zh: 地爆天星的热能流划过天际。大气燃烧，地表在冲击中崩解。即使这里只是行星表面的一隅，末日也已降临。
showMessageToAllEnemyPlayers_en: The World Cracker's thermal stream cuts across the sky. The atmosphere burns and the surface breaks under the impact. Even in this small corner of a planet, the end has come.
showMessageToPlayer: The World Cracker has fired. Its thermal stream is racing toward the target, where everything will be consumed by fire and shockwaves.
showMessageToPlayer_zh: 地爆天星已经开火。热能流正奔向目标，那里的一切都将被烈焰与冲击吞没。
showMessageToPlayer_en: The World Cracker has fired. Its thermal stream is racing toward the target, where everything will be consumed by fire and shockwaves.
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 4
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null

[action_neutronGround]
text: Neutron Sweep
text_zh: 中子灭杀
text_en: Neutron Sweep
description: Sweeps the target area with neutron radiation, eliminating ground forces and neutralizing surviving buildings. Airborne fleets are unaffected.
description_zh: 以中子辐射清除指定区域内的地面部队，并使幸存建筑失去控制。空中舰队不受影响。
description_en: Sweeps the target area with neutron radiation, eliminating ground forces and neutralizing surviving buildings. Airborne fleets are unaffected.
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 5
showMessageToAllEnemyPlayers: A neutron plume sweeps the target area. Communications vanish one by one. Moments later, the wind replaces the sounds of life and war. The buildings still stand, but those who operated them are gone.
showMessageToAllEnemyPlayers_zh: 中子羽流扫过目标区域。通讯信号逐一消失。片刻之后，风声取代了生命与战争的喧嚣。建筑依然矗立，操纵它们的人却已不复存在。
showMessageToAllEnemyPlayers_en: A neutron plume sweeps the target area. Communications vanish one by one. Moments later, the wind replaces the sounds of life and war. The buildings still stand, but those who operated them are gone.
showMessageToPlayer: The Neutron Sweep has begun. Communications from the target area are falling silent one by one. Soon, only the wind will remain.
showMessageToPlayer_zh: 中子灭杀已经开始。目标区域的通讯信号正在逐一沉寂，很快，那里将只剩下风声。
showMessageToPlayer_en: The Neutron Sweep has begun. Communications from the target area are falling silent one by one. Soon, only the wind will remain.
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 5
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null

