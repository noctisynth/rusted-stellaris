[core]
name: rsColossus
class: CustomUnitMetadata
displayText: 巨像
displayDescription: 第四时代终极武器，可发动地爆天星、中子灭杀和安乐天使。
tags: rsColossus
price: credits=20000, alloys=1200, strategic=80, colossusPermit=1
maxHp: 15000
mass: 44000
techLevel: 3
buildSpeed: 0.00025
radius: 46
isBio: false
softCollisionOnAll: 3
energyMax: 1
energyRegen: 0.000185
energyNeedsToRechargeToFull: true

[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllPlayers: 银河通讯，一艘巨像已现身。能够决定整颗行星命运的武器，如今成为银河政治的现实。
showMessageToPlayer: 我们的巨像已服役。地爆天星、中子灭杀与安乐天使的选择，将由帝国承担其后果。

[hiddenAction_returnPermit]
autoTriggerOnEvent: destroyed
addResources: colossusPermit=1

[action_worldCracker]
text: 地爆天星
description: 对完整行星充能 45 秒，永久破碎目标。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 1
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 1
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_neutronSweep]
text: 中子灭杀
description: 对殖民行星充能 45 秒，清除殖民地并保留可再殖民的星球。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 2
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 2
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_pacifier]
text: 安乐天使
description: 对完整行星充能 45 秒，永久封存目标。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 3
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 3
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_worldCrackerGround]
text: 地爆天星
description: 指定区域产生核爆式伤害，不会改写地形。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 4
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 4
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null

[action_neutronGround]
text: 中子灭杀
description: 清除指定区域的地面作战单位，建筑转为中立，舰队不受影响。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 5
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 5
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null

