[core]
name: rsColossus
class: CustomUnitMetadata
displayText: 巨像
displayDescription: 第四时代终极武器，可发动地爆天星、中子灭杀和安乐天使。
tags: rsColossus
price: credits=20000, alloys=1200, strategic=80, colossusPermit=1
maxHp: 15000
mass: 44000
techLevel: 3
buildSpeed: 0.00019
radius: 46
isBio: false
softCollisionOnAll: 3
energyMax: 1
energyRegen: 0.000185
energyNeedsToRechargeToFull: true
autoTriggerCheckRate: every8Frames

[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: 我们收到消息，一个帝国已经完成了巨像的建造并投入服役。这是一种足以彻底毁灭行星的武器平台。银河的力量均衡，或许自此改变了……
showMessageToPlayer: 我们的巨像已经离开装配平台。我国历史上最庞大的武器平台现已投入使用，这一刻将成为帝国历史的转折点。
temporarilyAddTags: rsColossusAllyNoticePending
resetCustomTimer: true

[hiddenAction_dispatchAllyCompletionNotice]
autoTrigger: if self.tags(includes='rsColossusAllyNoticePending') and self.customTimer>1
temporarilyRemoveTags: rsColossusAllyNoticePending
takeResources: credits=0
takeResources_includeUnitsWithinRange: 99999
takeResources_includeUnitsWithinRange_team: allyNotOwn
takeResources_excludeUnitsWithoutTags: rsNoticeReceiver
takeResources_searchOnly: true
takeResources_maxUnits: 100000
takeResources_triggerActionForEach: sendAllyCompletionNotice

[hiddenAction_sendAllyCompletionNotice]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsAllyColossusCompleted

[hiddenAction_returnPermit]
autoTriggerOnEvent: destroyed
addResources: colossusPermit=1

[action_worldCracker]
text: 地爆天星
description: 歼星级武器。热能流将加热行星大气并引爆核心，最终由冲击波将整个世界炸得四分五裂。充能45秒，永久摧毁目标行星。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 1
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 1
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_neutronSweep]
text: 中子灭杀
description: 歼星级武器。加速的中子辐射羽流将扫过行星表面，摧毁绝大多数生命组织。充能45秒，清除殖民地，行星仍可再次殖民。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 2
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 2
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_pacifier]
text: 安乐天使
description: 歼星级武器。在行星周围部署永久且不可逾越的屏蔽场，使整个世界与银河永远隔绝。充能45秒，永久封存目标行星。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 3
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 3
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null

[action_worldCrackerGround]
text: 地爆天星
description: 对指定区域投射地爆天星的热能流，造成毁灭性的核爆式打击。不会永久改变地图地形。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 4
showMessageToAllEnemyPlayers: 地爆天星的热能流划过天际。大气燃烧，地表在冲击中崩解。即使这里只是行星表面的一隅，末日也已降临。
showMessageToPlayer: 地爆天星已经开火。热能流正奔向目标，那里的一切都将被烈焰与冲击吞没。
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 4
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null

[action_neutronGround]
text: 中子灭杀
description: 以中子辐射清除指定区域内的地面部队，并使幸存建筑失去控制。空中舰队不受影响。
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
displayType: action
fireTurretXAtGround: 5
showMessageToAllEnemyPlayers: 中子羽流扫过目标区域。通讯信号逐一消失。片刻之后，风声取代了生命与战争的喧嚣。建筑依然矗立，操纵它们的人却已不复存在。
showMessageToPlayer: 中子灭杀已经开始。目标区域的通讯信号正在逐一沉寂，很快，那里将只剩下风声。
whenBuilding_cannotMove: true
onlyOneUnitAtATime: true
highPriorityQueue: true
pos: 5
isVisible: if globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null

[hiddenAction_aiSeekColony]
autoTrigger: if self.isControlledByAI and globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null and nearestUnit(withinRange=850, withTag='rsPlanetColony', relation='enemy') == null and globalSearchForFirstUnit(withTag='rsPlanetColony', relation='enemy') != null
addWaypoint_type: move
addWaypoint_target_nearestUnit_tagged: rsPlanetColony
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_target_nearestUnit_maxRange: 99999
addActionCooldownTime: 45s

[hiddenAction_aiQueueNeutronSweep]
autoTrigger: if self.isControlledByAI and globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') != null and nearestUnit(withinRange=850, withTag='rsPlanetColony', relation='enemy') != null and self.queueSize(withActionTag='rsAiColossusStrike')==0 and self.energy(full=true)
alsoQueueAction: aiNeutronSweep
addActionCooldownTime: 90s

[action_aiNeutronSweep]
tags: rsAiColossusStrike
isVisible: false
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
fireTurretXAtGround: 2
fireTurretXAtGround_withTarget: nearestUnit(withinRange=850, withTag='rsPlanetColony', relation='enemy')
whenBuilding_cannotMove: true
allowMultipleInQueue: false
addAllActionCooldownsTime: 90s

[hiddenAction_aiSeekEconomicTarget]
autoTrigger: if self.isControlledByAI and globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null and nearestUnit(withinRange=850, withTag='rsEconomicTarget', relation='enemy') == null and globalSearchForFirstUnit(withTag='rsEconomicTarget', relation='enemy') != null
addWaypoint_type: move
addWaypoint_target_nearestUnit_tagged: rsEconomicTarget
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_target_nearestUnit_maxRange: 99999
addActionCooldownTime: 45s

[hiddenAction_aiQueueWorldCrackerEconomic]
autoTrigger: if self.isControlledByAI and globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null and nearestUnit(withinRange=850, withTag='rsEconomicTarget', relation='enemy') != null and self.queueSize(withActionTag='rsAiColossusStrike')==0 and self.energy(full=true)
alsoQueueAction: aiWorldCrackerEconomic
addActionCooldownTime: 90s

[action_aiWorldCrackerEconomic]
tags: rsAiColossusStrike
isVisible: false
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
fireTurretXAtGround: 4
fireTurretXAtGround_withTarget: nearestUnit(withinRange=850, withTag='rsEconomicTarget', relation='enemy')
whenBuilding_cannotMove: true
allowMultipleInQueue: false
addAllActionCooldownsTime: 90s

[hiddenAction_aiSeekCapital]
autoTrigger: if self.isControlledByAI and globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null and globalSearchForFirstUnit(withTag='rsEconomicTarget', relation='enemy') == null and nearestUnit(withinRange=850, withTag='rsCapital', relation='enemy') == null and globalSearchForFirstUnit(withTag='rsCapital', relation='enemy') != null
addWaypoint_type: move
addWaypoint_target_nearestUnit_tagged: rsCapital
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_target_nearestUnit_maxRange: 99999
addActionCooldownTime: 45s

[hiddenAction_aiQueueWorldCrackerCapital]
autoTrigger: if self.isControlledByAI and globalSearchForFirstUnit(withTag='rsRareDeposit', relation='any') == null and globalSearchForFirstUnit(withTag='rsEconomicTarget', relation='enemy') == null and nearestUnit(withinRange=850, withTag='rsCapital', relation='enemy') != null and self.queueSize(withActionTag='rsAiColossusStrike')==0 and self.energy(full=true)
alsoQueueAction: aiWorldCrackerCapital
addActionCooldownTime: 90s

[action_aiWorldCrackerCapital]
tags: rsAiColossusStrike
isVisible: false
price: credits=1500, strategic=6, energy=1
buildSpeed: 45s
fireTurretXAtGround: 4
fireTurretXAtGround_withTarget: nearestUnit(withinRange=850, withTag='rsCapital', relation='enemy')
whenBuilding_cannotMove: true
allowMultipleInQueue: false
addAllActionCooldownsTime: 90s

