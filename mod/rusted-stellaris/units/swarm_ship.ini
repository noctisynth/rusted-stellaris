# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: corvette.ini
name: rsSwarmShip
displayText: Swarm Ship
displayText_zh: 蜂群舰
displayText_en: Swarm Ship
displayDescription: Exclusive to Hive Minds. Replenishes quickly and slowly repairs itself. Shorter range than a Corvette. No missile point defense.
displayDescription_zh: 蜂巢思维专属，快速补员并缓慢自我修复，射程短于护卫舰，不具备导弹近防。
displayDescription_en: Exclusive to Hive Minds. Replenishes quickly and slowly repairs itself. Shorter range than a Corvette. No missile point defense.
price: credits=700, minerals=45
maxHp: 500
techLevel: 2
buildSpeed: 0.005
selfRegenRate: 0.12

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=575)
setUnitStats: hp=self.hp*575/self.maxHp, maxHp=575
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*500/self.maxHp, maxHp=500
addResources: unsetFlag=1

[graphics]
image: swarm_ship.png
image_wreak: swarm_ship_dead.png

[attack]
maxAttackRange: 150
shootDelay: 32

[projectile_1]
directDamage: 40
color: #94DC7C

[movement]
moveSpeed: 2.3
