[core]
copyFrom: _building_t2_common.ini
name: rsFoundry
tags: rsEconomicTarget
displayText: 合金铸造厂
displayDescription: 每 2 秒自动消耗 2 矿物及 1 能量币，产出 1 合金；资源不足时停工。
price: credits=1635, minerals=90
maxHp: 950
techLevel: 2
autoTriggerCheckRate: every8Frames
autoTriggerCooldownTime: 2s

[action_smelting]
autoTrigger: if self.resource('minerals') >= 2 and self.resource('credits') >= 1
addResources: credits=-1, minerals=-2, alloys=1
[graphics]
scaleImagesTo: 48
image: foundry.png
image_wreak: foundry_dead.png

[ai]
buildPriority: 0.15
noneGlobalExtraPriority: 0.15
maxEachBase: 2
