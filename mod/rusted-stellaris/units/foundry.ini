[core]
copyFrom: _building_t2_common.ini
name: rsFoundry
tags: rsEconomicTarget
displayText: 合金铸造厂
displayDescription: 每 2 秒消耗 3 矿物和 2 能量币，产出 2 合金，资源不足时停工。可升级。
price: credits=1635, minerals=90
maxHp: 950
techLevel: 2
generation_resources: credits=-2, minerals=-3, alloys=2
generation_delay: 120
generation_active: if self.resource('minerals') >= 3 and self.resource('credits') >= 2

[action_upgradeFoundryT2]
text: 升级合金铸造厂 T2
description: 每 2 秒消耗 7 矿物和 4 能量币，产出 5 合金。
price: credits=1200, minerals=75, science=60
buildSpeed: 45s
displayType: upgrade
convertTo: rsFoundryT2
isLocked: if not self.globalTeamTags(includes='rsTechDestroyer')
isLockedMessage: 需要驱逐舰科技
ai_isHighPriority: true
[graphics]
scaleImagesTo: 48
image: foundry.png
image_wreak: foundry_dead.png

[ai]
buildPriority: 0.15
noneGlobalExtraPriority: 0.15
maxEachBase: 2
