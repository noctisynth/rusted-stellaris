[core]
name: rsFactionPicker
class: CustomUnitMetadata
displayText: 选择星际帝国
displayDescription: 选择常规帝国、机械智能或蜂巢思维，开启本局发展。
price: 4000
maxHp: 2600
mass: 10000
radius: 30
isBio: false
isBuilding: true
isPickableStartingUnit: true
buildSpeed: 0.0005
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
builtFrom_1_name: builder
builtFrom_1_pos: 15

[action_regular]
text: 常规帝国
description: 选择均衡发展的普通星际帝国。
price: 0
buildSpeed: 1s
displayType: upgrade
addGlobalTeamTags: rsFactionRegular
convertTo: rsStarbase
ai_isHighPriority: true
isLocked: if self.globalTeamTags(includes='rsFactionMachine') or self.globalTeamTags(includes='rsFactionHive')
isLockedMessage: 本队已选择其他帝国

[action_machine]
text: 机械智能
description: 选择机械意识帝国，走工业与维修路线。
price: 0
buildSpeed: 1s
displayType: upgrade
addGlobalTeamTags: rsFactionMachine
convertTo: rsStarbaseMachine
ai_isHighPriority: false
isLocked: if self.globalTeamTags(includes='rsFactionRegular') or self.globalTeamTags(includes='rsFactionHive')
isLockedMessage: 本队已选择其他帝国

[action_hive]
text: 蜂巢思维
description: 选择蜂巢帝国，走快速补员路线。
price: 0
buildSpeed: 1s
displayType: upgrade
addGlobalTeamTags: rsFactionHive
convertTo: rsStarbaseHive
ai_isHighPriority: false
isLocked: if self.globalTeamTags(includes='rsFactionRegular') or self.globalTeamTags(includes='rsFactionMachine')
isLockedMessage: 本队已选择其他帝国

[graphics]
total_frames: 1
image: faction_picker.png
image_wreak: faction_picker_dead.png
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
