# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: titan_paradox.ini
name: rsFallenTitan
tags: rsQuantumFleet, rsRaidFleet, rsLostEmpireFleet, rsFallenTitan
displayText: Fallen Empire Titan
displayText_zh: 失落帝国泰坦
displayText_en: Fallen Empire Titan
displayDescription: An ancient flagship. Its spinal annihilation cannon, rapid-fire secondary guns and guided missiles target independently. Heavy shields and energy-limited point defense protect the hull; repairs nearby fleets.
displayDescription_zh: 远古旗舰。轴向毁灭主炮、速射副炮与制导导弹分别索敌，厚重护盾及有限能量近防保护舰体，并维修邻近舰队。
displayDescription_en: An ancient flagship. Its spinal annihilation cannon, rapid-fire secondary guns and guided missiles target independently. Heavy shields and energy-limited point defense protect the hull; repairs nearby fleets.
price: credits=55000, alloys=3200, strategic=120
maxHp: 42000
maxShield: 30000
shieldRegen: 1.1
selfRegenRate: 0.45
shieldRenderRadius: 55
energyRegen: 0.0016
nanoRange: 240
nanoRepairSpeed: 0.6
mass: 50000
buildSpeed: 180s
radius: 50

[hiddenAction_announceCompletion]
@copyFrom_skipThisSection: true
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: A Fallen Empire Titan has entered service. An ancient hull has returned to the star charts, bearing a main cannon powerful enough to reshape the battlefield.
showMessageToAllEnemyPlayers_zh: 一艘失落帝国泰坦已经投入服役。远古舰体的轮廓重新出现在星图上，它的主炮足以改变整个战场。
showMessageToAllEnemyPlayers_en: A Fallen Empire Titan has entered service. An ancient hull has returned to the star charts, bearing a main cannon powerful enough to reshape the battlefield.
showMessageToPlayer: Our Fallen Empire Titan is complete. Ancient blueprints deciphered by our researchers have become the flagship of our fleet.
showMessageToPlayer_zh: 失落帝国泰坦已经建成。研究者破解的远古蓝图如今化作舰队的旗舰。
showMessageToPlayer_en: Our Fallen Empire Titan is complete. Ancient blueprints deciphered by our researchers have become the flagship of our fleet.

[hiddenAction_returnTitanPermit]
@copyFrom_skipThisSection: true
autoTrigger: false

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=48300)
setUnitStats: hp=self.hp*48300/self.maxHp, maxHp=48300
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*42000/self.maxHp, maxHp=42000
addResources: unsetFlag=1

[graphics]
image: fallen_titan.png
image_wreak: fallen_titan_dead.png
scaleImagesTo: 112

