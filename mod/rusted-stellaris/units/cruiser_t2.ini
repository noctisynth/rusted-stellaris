[core]
copyFrom: cruiser.ini
name: rsCruiserT2
displayText: 巡洋舰 T2
displayDescription: 主炮与速射副炮兼顾大小目标，具备护盾和自修，不具备导弹近防。
price: credits=4800, alloys=240, science=100
maxHp: 4100
maxShield: 1000
shieldRegen: 0.18
shieldRenderRadius: 28
selfRegenRate: 0.1
tags: rsQuantumFleet, rsRaidFleet, rsTier2

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=4715)
setUnitStats: hp=self.hp*4715/self.maxHp, maxHp=4715, shootDamageMultiplier=1.1
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*4100/self.maxHp, maxHp=4100, shootDamageMultiplier=1
addResources: unsetFlag=1

[action_upgradeCruiserT2]
isVisible: false

[graphics]
scaleImagesTo: 64
image: cruiser.png
image_wreak: cruiser_dead.png
