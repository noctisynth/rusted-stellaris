[core]
copyFrom: battleship.ini
name: rsMissileBattleship
displayText: 导弹战列舰
displayDescription: 三发远程导弹齐射配合双联副炮，导弹可被近防和激光防御拦截，适合饱和打击。
price: credits=7000, alloys=360
maxHp: 6000

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=6900)
setUnitStats: hp=self.hp*6900/self.maxHp, maxHp=6900
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*6000/self.maxHp, maxHp=6000
addResources: unsetFlag=1

[action_upgradeBattleshipT2]
convertTo: rsMissileBattleshipT2

[graphics]
scaleImagesTo: 80
image: battleship_missile.png
image_wreak: battleship_missile_dead.png

[attack]
maxAttackRange: 405
shootDelay: 132

[turret_4]
x: -12
y: 2
copyFrom: 1
invisible: true
delay: 132
warmup: 4

[turret_5]
x: 12
y: 2
copyFrom: 1
projectile: 1
invisible: true
delay: 132
warmup: 8

[projectile_1]
tags: rsMissile
instant: false
lightingEffect: false
laserEffect: false
directDamage: 70
areaDamage: 150
areaRadius: 45
life: 650
speed: 4.5
targetSpeed: 9
targetSpeedAcceleration: 0.12
autoTargetingOnDeadTarget: true
trailEffect: true
largeHitEffect: true
deflectionPower: 3
color: #EEA76B
drawSize: 2
lightColor: #EEA76B
lightSize: 0.3
