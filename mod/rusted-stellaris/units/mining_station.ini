# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
name: rsMiningStation
class: CustomUnitMetadata
displayText: Mining Station
displayText_zh: 采矿站
displayText_en: Mining Station
displayDescription: Produces 4 Minerals each cycle at a deposit.
displayDescription_zh: 在矿点上每周期产出 4 矿物。
displayDescription_en: Produces 4 Minerals each cycle at a deposit.
price: 700
maxHp: 600
mass: 9000
techLevel: 1
buildSpeed: 0.001
radius: 19
isBio: false
isBuilding: true
placeOnlyOnResPool: true
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
generation_resources: credits=8, minerals=4
builtFrom_1_name: rsEngineer
builtFrom_1_pos: 3
autoTriggerCheckRate: every8Frames

[graphics]
total_frames: 1
image: mining_station.png
scaleImagesTo: 48
image_wreak: mining_station_dead.png
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]
buildPriority: 0.40
recommendedInEachBaseNum: 2
recommendedInEachBasePriorityIfUnmet: 0.55
maxEachBase: 8

[action_upgradeMining]
text: Upgrade to Mining Station T2
text_zh: 升级采矿站 T2
text_en: Upgrade to Mining Station T2
description: Increases Minerals output on site.
description_zh: 在原址提高矿物产量。
description_en: Increases Minerals output on site.
price: credits=800, minerals=40, science=40
buildSpeed: 30s
displayType: upgrade
convertTo: rsMiningStationT2
isLocked: if not self.globalTeamTags(includes='rsTechDestroyer')
isLockedMessage: Research Destroyer Hulls first.
isLockedMessage_zh: 需要先研究驱逐舰舰体
isLockedMessage_en: Research Destroyer Hulls first.
ai_isHighPriority: true

[action_applyProcessingBonus]
autoTrigger: if self.numberOfUnitsInTeam(withTag='rsMineralPlant', greaterThan=0)
convertTo: rsMiningStationBoosted
