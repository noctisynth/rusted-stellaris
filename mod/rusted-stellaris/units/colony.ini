[core]
name: rsColony
class: CustomUnitMetadata
displayText: 行星殖民地
displayDescription: 依托完整行星建立殖民地，每周期产出能量币、矿物和科研。
tags: rsPlanetColony
price: credits=20, minerals=40
maxHp: 1500
mass: 9000
techLevel: 1
buildSpeed: 30s
radius: 20
isBio: false
isBuilding: true
footprint: 0,0,0,0
constructionFootprint: 0,0,0,0
generation_resources: credits=6, minerals=4, science=2
generation_delay: 3600
builtFrom_1_name: rsEngineer
builtFrom_1_pos: 19

[hiddenAction_colossusPurge]
autoTriggerOnEvent: newMessage(withTag='rsColossusPurge')
deleteSelf: true

[placementRule_nearPlanet]
searchTags: rsPlanetIntact
searchTeam: any
searchDistance: 48
excludeNonBuildings: false
minCount: 1
blocksPlacement: true
checkEachTile: false
cannotPlaceMessage: 只能在完整行星附近殖民

[placementRule_noColony]
searchTags: rsPlanetColony
searchTeam: any
searchDistance: 80
excludeNonBuildings: false
maxCount: 0
blocksPlacement: true
checkEachTile: false
cannotPlaceMessage: 附近已有殖民地

[graphics]
total_frames: 1
image: colony.png
image_wreak: colony_dead.png
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
