[core]
copyFrom: planet_unclaimed.ini
name: rsPlanetGalaxy04
displayText: 破碎-04 · 北境
displayDescription: 编号 Galaxy04 的无主行星。工程船可在其附近建立殖民地。
tags: rsPlanetIntact, rsPlanetGalaxy04

[graphics]
image: planet_unclaimed.png

[action_markOccupied]
autoTrigger: if nearestUnit(withinRange=48, withTag='rsPlanetColony', relation='any', incompleteBuildings=false) != null
convertTo: rsPlanetGalaxy04Occupied

[action_keepNeutral]
autoTrigger: if self.teamId() != -1
switchToTeam: -1

[hiddenAction_worldCrack]
autoTriggerOnEvent: tookDamage(withTag='rsWorldCracker')
showMessageToAllPlayers: 破碎-04 · 北境的地壳已经破裂，磁层也在分解。我们很难理解一颗星球死亡时的壮烈，但当它炽热的核心开始在冰冷宇宙中冷却，那种死亡之美无可争辩。
convertTo: rsPlanetGalaxy04Shattered
takeResources: credits=0
takeResources_includeUnitsWithinRange: 48
takeResources_includeUnitsWithinRange_team: any
takeResources_excludeUnitsWithoutTags: rsPlanetColony
takeResources_searchOnly: true
takeResources_triggerActionForEach: purgeColony

[hiddenAction_pacify]
autoTriggerOnEvent: tookDamage(withTag='rsPacifier')
showMessageToAllPlayers: 破碎-04 · 北境上空炫目的光芒已经黯淡，整个世界归于沉寂。也许历史会将这次把一颗行星从大宇宙中完全隔绝的行为视作极端且不合理。也许不会。无论如何，从现在起，这里只剩下一颗行星规模的水晶球。
convertTo: rsPlanetGalaxy04Sealed
takeResources: credits=0
takeResources_includeUnitsWithinRange: 48
takeResources_includeUnitsWithinRange_team: any
takeResources_excludeUnitsWithoutTags: rsPlanetColony
takeResources_searchOnly: true
takeResources_triggerActionForEach: purgeColony

[hiddenAction_purgeColony]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsColossusPurge
