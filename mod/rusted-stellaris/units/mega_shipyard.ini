[core]
copyFrom: _mega_shipyard_common.ini
name: rsMegaShipyard
displayText: Mega Shipyard
displayText_zh: 巨型船坞
displayText_en: Mega Shipyard
displayDescription: An age-four megastructure that builds imperial fleets at four times a normal Shipyard's speed. Can directly build researched T2 capital ships; a single queue still completes one ship at a time.
displayDescription_zh: 第四时代巨构，以普通造船厂四倍速度生产帝国舰队，可直接建造已研究的 T2 主力舰，同一队列仍逐艘完工。
displayDescription_en: An age-four megastructure that builds imperial fleets at four times a normal Shipyard's speed. Can directly build researched T2 capital ships; a single queue still completes one ship at a time.
price: credits=14500, alloys=1330, science=520, strategic=60
maxHp: 8200
buildSpeed: 180s
nanoFactorySpeed: 4
exit_x: 0
exit_y: -2
canBuild_2_name: setRally
canBuild_2_pos: 0.1

[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: A Mega Shipyard is fully operational. Its immense construction facilities are turning resources into fleets, forcing the galaxy's empires to reassess its builders' military potential.
showMessageToAllEnemyPlayers_zh: 巨型船坞已全面运作。庞大的造舰设施正在将资源转化为舰队，银河各国不得不重新估量其建造者的战争潜力。
showMessageToAllEnemyPlayers_en: A Mega Shipyard is fully operational. Its immense construction facilities are turning resources into fleets, forcing the galaxy's empires to reassess its builders' military potential.
showMessageToPlayer: The last fabrication district of our Mega Shipyard is online. Our fleets will take shape here, and our shipbuilding capacity can now sustain distant campaigns.
showMessageToPlayer_zh: 巨型船坞的最后一座制造区已经启用。帝国舰队将在这里成形，我们如今拥有足以支撑远征的造舰能力。
showMessageToPlayer_en: The last fabrication district of our Mega Shipyard is online. Our fleets will take shape here, and our shipbuilding capacity can now sustain distant campaigns.

