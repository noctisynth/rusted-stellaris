[core]
copyFrom: _mega_shipyard_common.ini
name: rsMegaShipyard
displayText: 巨型船坞
displayDescription: 第四时代巨构，以普通造船厂四倍速度生产帝国舰队，可直接建造已研究的 T2 主力舰，同一队列仍逐艘完工。
price: credits=14500, alloys=1330, science=520, strategic=60
maxHp: 8200
buildSpeed: 180s
nanoFactorySpeed: 4
exit_x: 0
exit_y: -2
canBuild_2_name: setRally
canBuild_2_pos: 0.1

[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: 巨型船坞已全面运作。庞大的造舰设施正在将资源转化为舰队，银河各国不得不重新估量其建造者的战争潜力。
showMessageToPlayer: 巨型船坞的最后一座制造区已经启用。帝国舰队将在这里成形，我们如今拥有足以支撑远征的造舰能力。

[canBuild_corvette]
name: rsCorvette
pos: 1
isLocked: if self.isControlledByAI and self.resource('rsAiHandicap') >= 3.7 and self.globalTeamTags(includes='rsTechCruiser')

[canBuild_destroyer]
name: rsDestroyer
pos: 2
tech: 2
isLocked: if not self.globalTeamTags(includes='rsTechDestroyer')
isLockedMessage: 需要驱逐舰舰体科技

[canBuild_cruiser]
name: rsCruiser
pos: 3
tech: 2
isLocked: if not self.globalTeamTags(includes='rsTechCruiser')
isLockedMessage: 需要巡洋舰舰体科技

