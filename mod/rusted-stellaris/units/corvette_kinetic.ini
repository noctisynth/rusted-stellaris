[core]
copyFrom: corvette.ini
name: rsCorvetteKinetic
displayText: 动能护卫舰
displayDescription: 近距高射速动能炮，不具备导弹近防，适合追击轻型舰。
price: credits=1200, minerals=65
maxHp: 700

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=805)
setUnitStats: hp=self.hp*805/self.maxHp, maxHp=805
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*700/self.maxHp, maxHp=700
addResources: unsetFlag=1

[graphics]
scaleImagesTo: 32
image: corvette_kinetic.png
image_wreak: corvette_kinetic_dead.png

[attack]
maxAttackRange: 165
shootDelay: 24

[projectile_1]
directDamage: 48
life: 35
instant: false
lightingEffect: false
laserEffect: false
deflectionPower: -1
speed: 10
color: #F2C979
drawSize: 0.9
lightColor: #F2C979
lightSize: 0.15
