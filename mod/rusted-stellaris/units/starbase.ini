[core]
name: rsStarbase
tags: rsCapital
class: CustomUnitMetadata
displayText: 恒星基地
displayDescription: 每周期产出 24 能量币与 2 矿物，维修射程内舰队并守卫首都。
price: 4000
maxHp: 14000
mass: 10000
techLevel: 1
buildSpeed: 0.0005
autoTriggerCooldownTime: 2s
radius: 30
isBio: false
isBuilding: true
autoRepair: true
canRepairBuildings: true
canRepairUnits: true
nanoRange: 245
nanoRepairSpeed: 0.60
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
generation_resources: credits=24, minerals=2
canBuild_1_name: rsEngineer
canBuild_1_pos: 1
canBuild_2_name: rsScienceShip
canBuild_2_pos: 2
canBuild_3_name: setRally
canBuild_3_pos: 0.1
canBuild_4_name: builder
canBuild_4_pos: 4

[action_upgradeStarhold]
text: 升级星堡
description: 升级为第二级恒星基地。
price: credits=1800, minerals=60, alloys=120, science=70
buildSpeed: 65s
displayType: upgrade
convertTo: rsStarhold
isLocked: if not self.globalTeamTags(includes='rsTechStarhold')
isLockedMessage: 需要研究星堡科技

ai_isHighPriority: true

[hiddenAction_aiMassAssault]
autoTrigger: if self.isControlledByAI and self.resource('rsAiHandicap') >= 1.8 and self.resource('rsAiHandicap') < 3.7 and self.numberOfUnitsInTeam(withTag='rsQuantumFleet', greaterThan=17, withinRange=700) and globalSearchForFirstUnit(withTag='rsCapital', relation='enemy') != null
takeResources: credits=0
takeResources_includeUnitsWithinRange: 700
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsQuantumFleet
takeResources_searchOnly: true
takeResources_maxUnits: 28
takeResources_triggerActionForEach: sendAiAssault
addActionCooldownTime: 180s

[hiddenAction_aiMassAssaultImpossible]
autoTrigger: if self.isControlledByAI and self.resource('rsAiHandicap') >= 3.7 and self.numberOfUnitsInTeam(withTag='rsQuantumFleet', greaterThan=31, withinRange=900) and self.numberOfUnitsInTeam(withTag='rsRaidFleet', greaterThan=11, withinRange=900) and globalSearchForFirstUnit(withTag='rsCapital', relation='enemy') != null
takeResources: credits=0
takeResources_includeUnitsWithinRange: 900
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsQuantumFleet
takeResources_searchOnly: true
takeResources_maxUnits: 48
takeResources_triggerActionForEach: sendAiAssault
addActionCooldownTime: 240s

[hiddenAction_sendAiAssault]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsAiAssault

[graphics]
total_frames: 1
image: starbase.png
scaleImagesTo: 64
image_wreak: starbase_dead.png
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 245
shootDelay: 40
turretSize: 8
turretTurnSpeed: 4

[turret_1]
x: -12
y: 0
projectile: 1
shoot_sound: plasma_fire
shoot_sound_vol: 0.15
shoot_light: #66BBFF

[turret_2]
x: 12
y: 0
projectile: 1
shoot_sound: plasma_fire
shoot_sound_vol: 0.15
shoot_light: #66BBFF

[projectile_1]
directDamage: 75
life: 90
speed: 6
color: #66BBFF
drawSize: 1.2

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1
