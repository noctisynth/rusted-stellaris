[core]
name: rsDestroyer
tags: rsQuantumFleet
class: CustomUnitMetadata
displayText: 驱逐舰
displayDescription: 中型屏卫舰，激光近防消耗储能拦截导弹，副炮能独立压制小舰。
price: credits=1800, minerals=130
maxHp: 1300
energyMax: 1
energyRegen: 0.0015
mass: 5000
techLevel: 2
buildSpeed: 0.0018
radius: 18
isBio: false
softCollisionOnAll: 3

[hiddenAction_academyTraining]
autoTrigger: if self.globalTeamTags(includes='rsAcademyTraining') and not self.tags(includes='rsVeteran')
convertTo: rsDestroyerVeteran

[hiddenAction_receiveQuantumLaunch]
autoTriggerOnEvent: newMessage(withTag='rsQuantumLaunch')
teleportTo: eventData('exit', type='unit')

[hiddenAction_receiveQuantumRaid]
autoTriggerOnEvent: newMessage(withTag='rsQuantumRaid')
teleportTo: eventData('target', type='unit')
temporarilyAddTags: rsRaidArrived

[hiddenAction_receiveAiAssault]
autoTriggerOnEvent: newMessage(withTag='rsAiAssault')
addWaypoint_type: attack
addWaypoint_target_nearestUnit_tagged: rsCapital
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_target_nearestUnit_maxRange: 99999

[hiddenAction_raidEconomicTarget]
autoTrigger: if self.tags(includes='rsRaidArrived') and self.numberOfUnitsInEnemyTeam(withTag='rsEconomicTarget', withinRange=320, greaterThan=0)
temporarilyRemoveTags: rsRaidArrived
addWaypoint_type: attack
addWaypoint_target_nearestUnit_tagged: rsEconomicTarget
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_target_nearestUnit_maxRange: 320

[graphics]
total_frames: 1
image: destroyer.png
scaleImagesTo: 48
image_wreak: destroyer_dead.png
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2
lock_body_rotation_with_main_turret: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 220
shootDelay: 40
turretMultiTargeting: true
turretRotateWithBody: true

[turret_1]
x: 0
y: 0
invisible: true
projectile: 1
turnSpeed: 4.8
shoot_sound: plasma_fire
shoot_sound_vol: 0.2
shoot_light: #7ED5FF

[turret_pd]
x: 0
y: -4
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.55
limitingRange: 95
size: 1

[turret_2]
x: 0
y: -6
invisible: true
projectile: 3
canAttackFlyingUnits: true
canAttackLandUnits: false
limitingRange: 140
delay: 24
turnSpeed: 12
shoot_sound: plasma_fire
shoot_sound_vol: 0.10
shoot_light: #9BD6FF

[projectile_1]
directDamage: 105
life: 25
instant: true
lightingEffect: true
color: #7ED5FF
drawSize: 1.3

[projectile_3]
directDamage: 28
life: 25
instant: true
lightingEffect: true
color: #9BD6FF
drawSize: 0.8

[movement]
movementType: AIR
moveSpeed: 1.55
moveAccelerationSpeed: 0.075
moveDecelerationSpeed: 0.1
maxTurnSpeed: 3.8
turnAcceleration: 0.3
targetHeight: 17
targetHeightDrift: 0
moveIgnoringBody: true

[ai]
buildPriority: 0.23
