[core]
name: rsDestroyer
tags: rsQuantumFleet
class: CustomUnitMetadata
displayText: 驱逐舰
displayDescription: 配备近防火炮的中型护航舰。需要驱逐舰舰体研究。
price: credits=1800, minerals=130
maxHp: 1300
mass: 5000
techLevel: 2
buildSpeed: 0.0018
radius: 18
isBio: false
softCollisionOnAll: 3

[hiddenAction_academyTraining]
autoTrigger: if self.globalTeamTags(includes='rsAcademyTraining') and not self.tags(includes='rsVeteran')
convertTo: rsDestroyerVeteran

[hiddenAction_receiveQuantumLaunch]
autoTriggerOnEvent: newMessage(withTag='rsQuantumLaunch')
teleportTo: eventData('exit', type='unit')

[graphics]
total_frames: 1
image: destroyer.png
image_wreak: destroyer_dead.png
image_shadow: AUTO
shadowOffsetX: 2
shadowOffsetY: 2
lock_body_rotation_with_main_turret: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 220
shootDelay: 36
turretRotateWithBody: true

[turret_1]
x: 0
y: 0
invisible: true
projectile: 1
turnSpeed: 4.8
shoot_sound: plasma_fire
shoot_sound_vol: 0.2
shoot_light: #7ED5FF

[turret_pd]
x: 0
y: -4
canShoot: false
invisible: true
projectile: 2
interceptProjectiles_withTags: rsMissile
interceptProjectiles_andUnderDistance: 130
turnSpeed: 25

[projectile_1]
directDamage: 80
life: 85
speed: 8
color: #7ED5FF
drawSize: 1.3

[projectile_2]
directDamage: 1
life: 70
speed: 12
color: #B8E8F3
drawSize: 0.7

[movement]
movementType: AIR
moveSpeed: 1.55
moveAccelerationSpeed: 0.075
moveDecelerationSpeed: 0.1
maxTurnSpeed: 3.8
turnAcceleration: 0.3
targetHeight: 17
targetHeightDrift: 0
moveIgnoringBody: true

[ai]
buildPriority: 0.23
