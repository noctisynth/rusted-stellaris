[core]
copyFrom: battleship.ini
name: rsJuggernaut
displayText: 主宰
displayDescription: 第四时代移动船坞，可在前线补充舰船并维修友舰，主炮和双联副炮可自卫，不具备导弹近防。
price: credits=16000, alloys=950, strategic=60, juggernautPermit=1
maxHp: 13000
mass: 36000
techLevel: 3
experimental: true
buildSpeed: 0.00021
nanoFactorySpeed: 2
radius: 47
tags: rsQuantumFleet, rsRaidFleet, rsJuggernaut
canRepairBuildings: true
canRepairUnits: true
nanoRange: 125
nanoRepairSpeed: 0.3
canBuild_2_name: setRally
canBuild_2_pos: 0.1

[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: 帝王的杀手锏\n\n经确认，一个帝国已经完成了巨型主宰舰的建造。这一行动自如的太空基地装配了海量火力，并能在作战前线建造和维护舰船，使其在任何作战场景下都是更严峻的威胁。\n\n这真的是太空战里的尖端军备。
showMessageToPlayer: 君临太虚\n\n威震寰宇的主宰已经建成。\n\n这艘行动自如的庞然巨舰将彻底改变进攻作战的范式。它可以在前线建造和维修舰船，并配有足以摧枯拉朽的火力，使我们得以不间断地攻击那些敢与我们作对的人。\n\n如今只有蠢货才会对抗我们。

[action_quantumJump]
price: credits=3200, strategic=3

[canBuild_corvette]
name: rsCorvette
pos: 1
isLocked: if self.isControlledByAI and self.resource('rsAiHandicap') >= 3.7 and self.globalTeamTags(includes='rsTechCruiser')

[canBuild_destroyer]
name: rsDestroyer
pos: 2
tech: 2
isLocked: if not self.globalTeamTags(includes='rsTechDestroyer')
isLockedMessage: 需要研究驱逐舰舰体

[canBuild_fighter]
name: rsFighter
pos: 3
tech: 2
isLocked: if not self.globalTeamTags(includes='rsTechCarrier')
isLockedMessage: 需要研究舰载机作战

[canBuild_cruiserT2]
name: rsCruiserT2
pos: 4
tech: 2
isLocked: if not self.globalTeamTags(includes='rsTechCruiser') or not self.globalTeamTags(includes='rsTechShields')
isLockedMessage: 需要巡洋舰舰体与护盾发生器科技

[canBuild_cruiserMissileT2]
name: rsCruiserMissileT2
pos: 5
tech: 2
isLocked: if not self.globalTeamTags(includes='rsTechCruiser') or not self.globalTeamTags(includes='rsTechMissiles') or not self.globalTeamTags(includes='rsTechShields')
isLockedMessage: 需要巡洋舰、远程导弹与护盾科技

[canBuild_carrierCruiserT2]
name: rsCarrierCruiserT2
pos: 6
tech: 3
isLocked: if not self.globalTeamTags(includes='rsTechCarrier') or not self.globalTeamTags(includes='rsTechShields')
isLockedMessage: 需要舰载机作战与护盾科技

[canBuild_battleshipT2]
name: rsBattleshipT2
pos: 7
tech: 3
isLocked: if not self.globalTeamTags(includes='rsTechBattleship') or not self.globalTeamTags(includes='rsTechShields')
isLockedMessage: 需要战列舰舰体与护盾科技

[canBuild_missileBattleshipT2]
name: rsMissileBattleshipT2
pos: 8
tech: 3
isLocked: if not self.globalTeamTags(includes='rsTechBattleship') or not self.globalTeamTags(includes='rsTechMissiles') or not self.globalTeamTags(includes='rsTechShields')
isLockedMessage: 需要战列舰、远程导弹与护盾科技

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=14950)
setUnitStats: hp=self.hp*14950/self.maxHp, maxHp=14950, shootDamageMultiplier=1.1
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*13000/self.maxHp, maxHp=13000, shootDamageMultiplier=1
addResources: unsetFlag=1

[hiddenAction_returnJuggernautPermit]
autoTriggerOnEvent: destroyed
addResources: juggernautPermit=1

[action_upgradeBattleshipT2]
isVisible: false

[graphics]
scaleImagesTo: 96
image: juggernaut.png
