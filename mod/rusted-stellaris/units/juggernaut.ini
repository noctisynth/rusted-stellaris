[core]
copyFrom: battleship.ini
name: rsJuggernaut
displayText: Juggernaut
displayText_zh: 主宰
displayText_en: Juggernaut
displayDescription: An age-four mobile shipyard that builds and repairs ships at the front. Main and twin secondary guns provide self-defense; no missile point defense. Its Fire Control aura grants friendly and allied combat starships within 650 range +10% weapon damage and +10% fire rate. Multiple Juggernauts do not stack; Juggernauts and Colossi receive no bonus.
displayDescription_zh: 第四时代移动船坞，可在前线补充舰船并维修友舰，主炮和双联副炮可自卫，不具备导弹近防。火力指挥光环覆盖650范围内的同队与盟友作战星舰，武器伤害与射速各提高10%，多个主宰不叠加，主宰自身和巨像不受益。
displayDescription_en: An age-four mobile shipyard that builds and repairs ships at the front. Main and twin secondary guns provide self-defense; no missile point defense. Its Fire Control aura grants friendly and allied combat starships within 650 range +10% weapon damage and +10% fire rate. Multiple Juggernauts do not stack; Juggernauts and Colossi receive no bonus.
price: credits=16000, alloys=950, strategic=60, juggernautPermit=1
maxHp: 13000
mass: 36000
techLevel: 3
experimental: true
buildSpeed: 0.00021
nanoFactorySpeed: 2
radius: 47
tags: rsQuantumFleet, rsRaidFleet, rsJuggernaut
canRepairBuildings: true
canRepairUnits: true
nanoRange: 125
nanoRepairSpeed: 0.3
