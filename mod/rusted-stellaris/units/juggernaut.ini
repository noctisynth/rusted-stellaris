[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: An Empire's Trump Card\nAn empire has confirmed the completion of a massive Juggernaut. This mobile starbase combines immense firepower with the ability to build and service ships at the front, making it a formidable threat in any theater of war.\nThis is truly the cutting edge of space warfare.
showMessageToAllEnemyPlayers_zh: 帝王的杀手锏\n经确认，一个帝国已经完成了巨型主宰舰的建造。这一行动自如的太空基地装配了海量火力，并能在作战前线建造和维护舰船，使其在任何作战场景下都是更严峻的威胁。\n这真的是太空战里的尖端军备。
showMessageToAllEnemyPlayers_en: An Empire's Trump Card\nAn empire has confirmed the completion of a massive Juggernaut. This mobile starbase combines immense firepower with the ability to build and service ships at the front, making it a formidable threat in any theater of war.\nThis is truly the cutting edge of space warfare.
showMessageToPlayer: Sovereign of the Void\nOur mighty Juggernaut is complete.\nThis mobile behemoth will transform offensive warfare. It can build and repair ships at the front, and its overwhelming firepower will let us maintain relentless pressure on any who dare oppose us.\nOnly fools would stand against us now.
showMessageToPlayer_zh: 君临太虚\n威震寰宇的主宰已经建成。\n这艘行动自如的庞然巨舰将彻底改变进攻作战的范式。它可以在前线建造和维修舰船，并配有足以摧枯拉朽的火力，使我们得以不间断地攻击那些敢与我们作对的人。\n如今只有蠢货才会对抗我们。
showMessageToPlayer_en: Sovereign of the Void\nOur mighty Juggernaut is complete.\nThis mobile behemoth will transform offensive warfare. It can build and repair ships at the front, and its overwhelming firepower will let us maintain relentless pressure on any who dare oppose us.\nOnly fools would stand against us now.

