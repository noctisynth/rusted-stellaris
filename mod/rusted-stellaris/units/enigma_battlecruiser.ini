[core]
copyFrom: battleship.ini
name: rsEnigmaBattlecruiser
tags: rsQuantumFleet, rsRaidFleet, rsLostEmpireFleet
displayText: 神秘战巡舰
displayDescription: 失落帝国重型主力舰。双轴重炮、独立索敌副炮、强力护盾与有限能量激光近防，可拦截导弹。
price: credits=22000, alloys=1200, strategic=40
maxHp: 16000
maxShield: 12000
shieldRegen: 0.8
selfRegenRate: 0.25
energyMax: 1
energyRegen: 0.0016
mass: 24000
techLevel: 3
buildSpeed: 110s
radius: 40

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=18400)
setUnitStats: hp=self.hp*18400/self.maxHp, maxHp=18400, shootDamageMultiplier=1.1
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*16000/self.maxHp, maxHp=16000, shootDamageMultiplier=1
addResources: unsetFlag=1

[action_upgradeBattleshipT2]
isVisible: false

[graphics]
image: enigma_battlecruiser.png
image_wreak: enigma_battlecruiser_dead.png
scaleImagesTo: 96

[attack]
maxAttackRange: 420
shootDelay: 70

[turret_1]
x: -9
y: 20

[turret_spinalSecond]
copyFrom: 1
x: 9
y: 20
warmup: 6

[turret_2]
x: -21
y: 0
delay: 12
limitingRange: 290

[turret_3]
x: 21
y: 0

[turret_laserDefence]
x: 0
y: -5
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.16
limitingRange: 170
size: 1

[projectile_1]
directDamage: 1300
color: #AA79E2DD
lightColor: #79E2DD

[projectile_3]
directDamage: 180

[movement]
moveSpeed: 1.4
maxTurnSpeed: 1.8

[ai]
buildPriority: 0.25
