# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: cruiser_missile.ini
name: rsCruiserMissileT2
displayText: Missile Cruiser T2
displayText_zh: 导弹巡洋舰 T2
displayText_en: Missile Cruiser T2
displayDescription: Twin long-range missiles and close-range secondary guns. Missiles can be intercepted. Has shields and self-repair, but no missile point defense.
displayDescription_zh: 双发远程导弹配合近距副炮，导弹可被拦截，具备护盾和自修，不具备导弹近防。
displayDescription_en: Twin long-range missiles and close-range secondary guns. Missiles can be intercepted. Has shields and self-repair, but no missile point defense.
price: credits=5200, alloys=260, science=100
maxHp: 3800
maxShield: 1000
shieldRegen: 0.18
shieldRenderRadius: 28
selfRegenRate: 0.1
tags: rsQuantumFleet, rsRaidFleet, rsTier2

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=4370)
setUnitStats: hp=self.hp*4370/self.maxHp, maxHp=4370
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*3800/self.maxHp, maxHp=3800
addResources: unsetFlag=1

[action_upgradeCruiserT2]
isVisible: false

[graphics]
scaleImagesTo: 64
image: cruiser_missile.png
image_wreak: cruiser_missile_dead.png
