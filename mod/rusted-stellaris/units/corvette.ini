[core]
name: rsCorvette
tags: rsQuantumFleet
class: CustomUnitMetadata
displayText: 护卫舰
displayDescription: 快速屏卫舰，装备轻型速射激光炮，不具备导弹近防。
price: credits=1050, minerals=55
maxHp: 650
mass: 2500
techLevel: 1
buildSpeed: 0.003
radius: 11
isBio: false
softCollisionOnAll: 3

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and self.globalTeamTags(includes='rsAcademyTraining') and not self.tags(includes='rsVeteran')
convertTo: rsCorvetteVeteran

[hiddenAction_markConstructionComplete]
autoTriggerOnEvent: completeAndActive
temporarilyAddTags: rsConstructionComplete

[hiddenAction_receiveQuantumLaunch]
autoTriggerOnEvent: newMessage(withTag='rsQuantumLaunch')
teleportTo: eventData('exit', type='unit')

[hiddenAction_receiveAiAssault]
autoTriggerOnEvent: newMessage(withTag='rsAiAssault')
addWaypoint_type: attack
addWaypoint_target_nearestUnit_tagged: rsCapital
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_target_nearestUnit_maxRange: 99999

[graphics]
total_frames: 1
image: corvette.png
scaleImagesTo: 32
image_wreak: corvette_dead.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
lock_body_rotation_with_main_turret: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 185
shootDelay: 34
turretRotateWithBody: true

[turret_1]
x: 0
y: 0
invisible: true
projectile: 1
turnSpeed: 5
shoot_sound: plasma_fire
shoot_sound_vol: 0.15
shoot_light: #55AAFF

[projectile_1]
directDamage: 60
life: 8
instant: true
laserEffect: true
color: #9955AAFF
drawSize: 0.8
lightColor: #55AAFF
lightSize: 0.2

[movement]
movementType: AIR
moveSpeed: 1.65
moveAccelerationSpeed: 0.09
moveDecelerationSpeed: 0.1
maxTurnSpeed: 5
turnAcceleration: 0.4
targetHeight: 16
targetHeightDrift: 0
moveIgnoringBody: true

[ai]
buildPriority: 0.42
