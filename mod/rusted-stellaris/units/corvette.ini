[core]
name: rsCorvette
tags: rsQuantumFleet
class: CustomUnitMetadata
displayText: 护卫舰
displayDescription: 快速小型战舰，装备基础激光炮。
price: credits=1050, minerals=55
maxHp: 650
mass: 2500
techLevel: 1
buildSpeed: 0.003
radius: 11
isBio: false
softCollisionOnAll: 3

[hiddenAction_academyTraining]
autoTrigger: if self.globalTeamTags(includes='rsAcademyTraining') and not self.tags(includes='rsVeteran')
convertTo: rsCorvetteVeteran

[hiddenAction_receiveQuantumLaunch]
autoTriggerOnEvent: newMessage(withTag='rsQuantumLaunch')
teleportTo: eventData('exit', type='unit')

[graphics]
total_frames: 1
image: corvette.png
scaleImagesTo: 32
image_wreak: corvette_dead.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
lock_body_rotation_with_main_turret: true

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 185
shootDelay: 38
turretRotateWithBody: true

[turret_1]
x: 0
y: 0
invisible: true
projectile: 1
turnSpeed: 5
shoot_sound: plasma_fire
shoot_sound_vol: 0.15
shoot_light: #55AAFF

[projectile_1]
directDamage: 55
life: 80
speed: 7
color: #55AAFF
drawSize: 1.1

[movement]
movementType: AIR
moveSpeed: 1.65
moveAccelerationSpeed: 0.09
moveDecelerationSpeed: 0.1
maxTurnSpeed: 5
turnAcceleration: 0.4
targetHeight: 16
targetHeightDrift: 0
moveIgnoringBody: true

[ai]
buildPriority: 0.26
