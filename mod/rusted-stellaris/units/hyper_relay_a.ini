# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: _hyper_relay_common.ini
name: rsHyperRelayA
displayText: Hyper Relay A
displayText_zh: 超空间中继 A
displayText_en: Hyper Relay A
displayDescription: Built near Hyperlane Exit A. Once your team's Relay B is complete, nearby ships can transit in both directions.
displayDescription_zh: 在航道出口 A 附近建设，本队中继 B 完工后，可双向投送附近舰船。
displayDescription_en: Built near Hyperlane Exit A. Once your team's Relay B is complete, nearby ships can transit in both directions.
tags: rsHyperRelayA

[placementRule_nearExitA]
searchTags: rsQuantumExitA
searchTeam: any
searchDistance: 60
excludeNonBuildings: false
minCount: 1
blocksPlacement: true
checkEachTile: false
cannotPlaceMessage: Can only be built near Hyperlane Exit A on dedicated maps.
cannotPlaceMessage_zh: 只能在专用地图的航道出口 A 附近建设
cannotPlaceMessage_en: Can only be built near Hyperlane Exit A on dedicated maps.

[action_launchToB]
text: Relay Transit to B
text_zh: 中继投送至 B
text_en: Relay Transit to B
description: Transports up to 8 nearby ships on your team to your team's Relay B.
description_zh: 将附近至多 8 艘本队舰船送到本队中继 B。
description_en: Transports up to 8 nearby ships on your team to your team's Relay B.
price: credits=300, strategic=1
buildSpeed: 2s
displayType: action
takeResources: credits=0
takeResources_includeUnitsWithinRange: 140
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsQuantumFleet
takeResources_searchOnly: true
takeResources_maxUnits: 8
takeResources_triggerActionForEach: sendToB
addActionCooldownTime: 30s
isLocked: if globalSearchForFirstUnit(withTag='rsHyperRelayB', relation='own') == null
isLockedMessage: Requires your team's Relay B.
isLockedMessage_zh: 需要本队的中继 B
isLockedMessage_en: Requires your team's Relay B.

[hiddenAction_sendToB]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsQuantumLaunch
sendMessageWithData: exit=globalSearchForFirstUnit(withTag='rsHyperRelayB', relation='own')

[graphics]
image: hyper_relay.png
image_wreak: hyper_relay_dead.png
