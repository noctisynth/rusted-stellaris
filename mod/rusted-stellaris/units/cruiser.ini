[core]
copyFrom: destroyer.ini
name: rsCruiser
tags: rsQuantumFleet, rsRaidFleet
displayText: 巡洋舰
displayDescription: 中型能量主炮配合近距速射副炮，可同时压制主力舰和小舰，不具备导弹近防。
price: credits=3300, alloys=150
maxHp: 3200
mass: 8500
techLevel: 2
buildSpeed: 0.00082
radius: 25

[hiddenAction_academyTraining]
convertTo: rsCruiserVeteran

[action_upgradeCruiserT2]
text: 升级巡洋舰 T2
description: 获得能量护盾与舰体自修。
price: credits=1500, alloys=90, science=100
buildSpeed: 45s
displayType: upgrade
convertTo: rsCruiserT2
isLocked: if not self.globalTeamTags(includes='rsTechShields')
isLockedMessage: 需要先研究护盾发生器

[action_quantumJump]
text: 长程跃迁
description: 量子弹弓完成后可用，指定地图落点，充能 20 秒，每舰消耗能量币和战略资源，冷却 150 秒。
price: credits=1200, strategic=1
buildSpeed: 20s
displayType: action
fireTurretXAtGround: quantumJump
fireTurretXAtGround_withProjectile: quantumJump
whenBuilding_cannotMove: true
highPriorityQueue: true
allowMultipleInQueue: false
addActionCooldownTime: 150s
isVisible: if self.globalTeamTags(includes='rsTechQuantumCatapult') or globalSearchForFirstUnit(withTag='rsQuantumCatapultOnline', relation='own') != null
isLocked: if globalSearchForFirstUnit(withTag='rsQuantumCatapultOnline', relation='own') == null
isLockedMessage: 需要本队完成量子弹弓

[graphics]
image: cruiser.png
scaleImagesTo: 64
image_wreak: cruiser_dead.png

[attack]
maxAttackRange: 270
shootDelay: 50
turretMultiTargeting: true

[turret_2]
x: 0
y: -8
invisible: true
projectile: 3
canAttackFlyingUnits: true
canAttackLandUnits: true
limitingRange: 165
delay: 20
turnSpeed: 14
shoot_sound: plasma_fire
shoot_sound_vol: 0.10
shoot_light: #9BD6FF

[turret_pd]
@copyFrom_skipThisSection: true

[projectile_1]
directDamage: 260
life: 10
instant: true
laserEffect: true
color: #AA7ED5FF
drawSize: 1
lightColor: #7ED5FF
lightSize: 0.3

[projectile_3]
directDamage: 40
life: 8
instant: true
laserEffect: true
color: #889BD6FF
drawSize: 0.75
lightColor: #9BD6FF
lightSize: 0.2

[turret_quantumJump]
x: 0
y: 0
canShoot: false
invisible: true
projectile: quantumJump
turnSpeed: 40
limitingRange: 20000

[projectile_quantumJump]
teleportSource: true
instant: true
directDamage: 0
life: 99999
speed: 1
targetGround: true
deflectionPower: -1
shouldRevealFog: true

[movement]
