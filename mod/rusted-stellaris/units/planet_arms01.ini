# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: planet_unclaimed.ini
name: rsPlanetArms01
displayText: Arms-01 · Core
displayText_zh: 三臂-01 · 核心
displayText_en: Arms-01 · Core
displayDescription: Unclaimed planet Arms01. Construction Ships can establish a colony nearby.
displayDescription_zh: 编号 Arms01 的无主行星。工程船可在其附近建立殖民地。
displayDescription_en: Unclaimed planet Arms01. Construction Ships can establish a colony nearby.
tags: rsPlanetIntact, rsPlanetArms01

[graphics]
image: planet_unclaimed.png

[action_markOccupied]
autoTrigger: if nearestUnit(withinRange=48, withTag='rsPlanetColony', relation='any', incompleteBuildings=false) != null
convertTo: rsPlanetArms01Occupied

[action_keepNeutral]
autoTrigger: if self.teamId() != -1
switchToTeam: -1

[hiddenAction_worldCrack]
autoTriggerOnEvent: tookDamage(withTag='rsWorldCracker')
showMessageToAllPlayers: The crust of Arms-01 · Core has fractured, and its magnetosphere is disintegrating. The spectacle of a world's death is difficult to comprehend, yet as its searing core cools in the cold of space, the beauty of that death is undeniable.
showMessageToAllPlayers_zh: 三臂-01 · 核心的地壳已经破裂，磁层也在分解。我们很难理解一颗星球死亡时的壮烈，但当它炽热的核心开始在冰冷宇宙中冷却，那种死亡之美无可争辩。
showMessageToAllPlayers_en: The crust of Arms-01 · Core has fractured, and its magnetosphere is disintegrating. The spectacle of a world's death is difficult to comprehend, yet as its searing core cools in the cold of space, the beauty of that death is undeniable.
convertTo: rsPlanetArms01Shattered
takeResources: credits=0
takeResources_includeUnitsWithinRange: 48
takeResources_includeUnitsWithinRange_team: any
takeResources_excludeUnitsWithoutTags: rsPlanetColony
takeResources_searchOnly: true
takeResources_triggerActionForEach: purgeColony

[hiddenAction_pacify]
autoTriggerOnEvent: tookDamage(withTag='rsPacifier')
showMessageToAllPlayers: The dazzling light above Arms-01 · Core has faded, and the world has fallen silent. History may judge the complete isolation of a planet from the universe to be extreme and unjustifiable. Perhaps it will not. Either way, only a planet-sized crystal sphere remains.
showMessageToAllPlayers_zh: 三臂-01 · 核心上空炫目的光芒已经黯淡，整个世界归于沉寂。也许历史会将这次把一颗行星从大宇宙中完全隔绝的行为视作极端且不合理。也许不会。无论如何，从现在起，这里只剩下一颗行星规模的水晶球。
showMessageToAllPlayers_en: The dazzling light above Arms-01 · Core has faded, and the world has fallen silent. History may judge the complete isolation of a planet from the universe to be extreme and unjustifiable. Perhaps it will not. Either way, only a planet-sized crystal sphere remains.
convertTo: rsPlanetArms01Sealed
takeResources: credits=0
takeResources_includeUnitsWithinRange: 48
takeResources_includeUnitsWithinRange_team: any
takeResources_excludeUnitsWithoutTags: rsPlanetColony
takeResources_searchOnly: true
takeResources_triggerActionForEach: purgeColony

[hiddenAction_purgeColony]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsColossusPurge
