[core]
copyFrom: corvette.ini
name: rsFighter
displayText: 护航机
displayDescription: 快速防空艇，射程短，适合护卫大型舰船，不具备导弹近防。
price: credits=248, alloys=12
maxHp: 135
mass: 1200
techLevel: 2
buildSpeed: 0.005
radius: 7

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=155)
setUnitStats: hp=self.hp*155/self.maxHp, maxHp=155
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*135/self.maxHp, maxHp=135
addResources: unsetFlag=1

[graphics]
scaleImagesTo: 32
image: fighter.png
image_wreak: fighter_dead.png

[attack]
canAttackLandUnits: false
maxAttackRange: 115
shootDelay: 22

[projectile_1]
directDamage: 13
speed: 10
drawSize: 0.7

[movement]
moveSpeed: 3.2
maxTurnSpeed: 7
