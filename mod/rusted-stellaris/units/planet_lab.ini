[core]
copyFrom: _building_t2_common.ini
name: rsPlanetLab
tags: rsEconomicTarget
displayText: 行星研究所
displayDescription: 研究站的第二级，保留全部科技研究项目。
price: credits=1600, minerals=75, science=60
maxHp: 700
techLevel: 2
generation_resources: science=5

[action_researchDestroyer]
text: 研究驱逐舰舰体
description: 消耗科研与矿物，永久解锁本队驱逐舰。
price: science=600, minerals=60
buildSpeed: 20s
displayType: upgrade
addGlobalTeamTags: rsTechDestroyer
isLocked: if not self.globalTeamTags(includes='rsFactionRegular') and not self.globalTeamTags(includes='rsFactionMachine') and not self.globalTeamTags(includes='rsFactionHive')
isLockedMessage: 需要先将行星指挥中心升级为恒星基地
isVisible: if not self.globalTeamTags(includes='rsTechDestroyer')

ai_isHighPriority: true
