[core]
copyFrom: cruiser.ini
name: rsRiddleEscort
tags: rsQuantumFleet, rsRaidFleet, rsLostEmpireFleet
displayText: 密语护航舰
displayDescription: 失落帝国屏卫舰。快速能量炮、厚重护盾与有限能量激光近防协同护航，可拦截导弹。
price: credits=7000, alloys=320, strategic=10
maxHp: 4800
maxShield: 3600
shieldRegen: 0.6
selfRegenRate: 0.18
energyMax: 1
energyRegen: 0.003
mass: 7000
techLevel: 3
buildSpeed: 45s
radius: 25

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=5520)
setUnitStats: hp=self.hp*5520/self.maxHp, maxHp=5520, shootDamageMultiplier=1.1
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*4800/self.maxHp, maxHp=4800, shootDamageMultiplier=1
addResources: unsetFlag=1

[action_upgradeCruiserT2]
isVisible: false

[graphics]
image: riddle_escort.png
image_wreak: riddle_escort_dead.png
scaleImagesTo: 64

[attack]
maxAttackRange: 300
shootDelay: 28

[turret_2]
delay: 10
limitingRange: 220

[turret_pd]
x: 0
y: -4
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.22
limitingRange: 150
size: 1

[projectile_1]
directDamage: 450
color: #AA79E2DD
lightColor: #79E2DD

[projectile_3]
directDamage: 90

[movement]
moveSpeed: 1.9
maxTurnSpeed: 4.3

[ai]
buildPriority: 0.28
