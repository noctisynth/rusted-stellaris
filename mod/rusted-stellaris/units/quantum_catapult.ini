[core]
copyFrom: _quantum_catapult_common.ini
name: rsQuantumCatapult
displayText: 量子弹弓
displayDescription: 集结附近至多 12 艘本队舰船，选择专用地图出口发射。
price: credits=15000, alloys=1450, science=620, strategic=75
maxHp: 8500
buildSpeed: 180s
autoTriggerCheckRate: every8Frames

[action_launchA]
text: 发射至航道出口 A
description: 将 180 像素内至多 12 艘本队舰船投送到出口 A。
price: credits=1500, strategic=4
buildSpeed: 2s
displayType: action
takeResources: credits=0
takeResources_includeUnitsWithinRange: 180
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsQuantumFleet
takeResources_searchOnly: true
takeResources_maxUnits: 12
takeResources_triggerActionForEach: sendToExitA
addActionCooldownTime: 90s
addAllActionCooldownsTime: 90s
isLocked: if globalSearchForFirstUnit(withTag='rsQuantumExitA', relation='any') == null
isLockedMessage: 本地图没有航道出口 A

[hiddenAction_sendToExitA]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsQuantumLaunch
sendMessageWithData: exit=globalSearchForFirstUnit(withTag='rsQuantumExitA', relation='any')

[action_launchB]
text: 发射至航道出口 B
description: 将 180 像素内至多 12 艘本队舰船投送到出口 B。
price: credits=1500, strategic=4
buildSpeed: 2s
displayType: action
takeResources: credits=0
takeResources_includeUnitsWithinRange: 180
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsQuantumFleet
takeResources_searchOnly: true
takeResources_maxUnits: 12
takeResources_triggerActionForEach: sendToExitB
addActionCooldownTime: 90s
addAllActionCooldownsTime: 90s
isLocked: if globalSearchForFirstUnit(withTag='rsQuantumExitB', relation='any') == null
isLockedMessage: 本地图没有航道出口 B

[hiddenAction_sendToExitB]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsQuantumLaunch
sendMessageWithData: exit=globalSearchForFirstUnit(withTag='rsQuantumExitB', relation='any')

[hiddenAction_aiEconomicRaid]
autoTrigger: if self.isControlledByAI and self.numberOfUnitsInTeam(withTag='rsRaidFleet', greaterThan=5, withinRange=180) and globalSearchForFirstUnit(withTag='rsEconomicTarget', relation='enemy') != null
price: credits=1500, strategic=4
buildSpeed: 2s
takeResources: credits=0
takeResources_includeUnitsWithinRange: 180
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsRaidFleet
takeResources_searchOnly: true
takeResources_maxUnits: 12
takeResources_triggerActionForEach: sendRaidFleet
addActionCooldownTime: 90s
addAllActionCooldownsTime: 90s

[hiddenAction_sendRaidFleet]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsQuantumRaid
sendMessageWithData: target=globalSearchForFirstUnit(withTag='rsEconomicTarget', relation='enemy')

[graphics]
scaleImagesTo: 96
image: quantum_catapult.png
image_wreak: quantum_catapult_dead.png
