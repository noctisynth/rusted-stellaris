# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: _quantum_catapult_common.ini
name: rsQuantumCatapult
displayText: Quantum Catapult
displayText_zh: 量子弹弓
displayText_en: Quantum Catapult
displayDescription: Unlocks long-range jumps to chosen destinations for your team's capital ships. High-difficulty AI can organize fleet raids against the enemy economy.
displayDescription_zh: 解锁本队主力舰指定落点的长程跃迁，高难度 AI 可组织舰队突袭敌方经济。
displayDescription_en: Unlocks long-range jumps to chosen destinations for your team's capital ships. High-difficulty AI can organize fleet raids against the enemy economy.
tags: rsQuantumCatapultChain, rsQuantumCatapultOnline
price: credits=15000, alloys=1450, science=620, strategic=75
maxHp: 8500
buildSpeed: 180s
autoTriggerCheckRate: every8Frames

[hiddenAction_announceCompletion]
autoTriggerOnEvent: completeAndActive
showMessageToAllEnemyPlayers: A Quantum Catapult has completed its final calibration and entered service. Fleets can now cross vast distances, putting established frontier defenses to a new test.
showMessageToAllEnemyPlayers_zh: 量子弹弓已完成最终校准并投入运行。舰队如今可以跨越漫长航程抵达远方，旧有的边境防线将面临新的考验。
showMessageToAllEnemyPlayers_en: A Quantum Catapult has completed its final calibration and entered service. Fleets can now cross vast distances, putting established frontier defenses to a new test.
showMessageToPlayer: Our Quantum Catapult's final calibration is complete. Capital fleets can prepare for long-range transit, extending our reach beyond conventional routes.
showMessageToPlayer_zh: 量子弹弓的最终校准已经完成。主力舰队可以准备长程投送，让帝国的力量抵达常规航道之外。
showMessageToPlayer_en: Our Quantum Catapult's final calibration is complete. Capital fleets can prepare for long-range transit, extending our reach beyond conventional routes.

[hiddenAction_aiEconomicRaid]
autoTrigger: if self.isControlledByAI and ((self.resource('rsAiHandicap') >= 3.7 and self.numberOfUnitsInTeam(withTag='rsRaidFleet', greaterThan=5, withinRange=180)) or (self.resource('rsAiHandicap') >= 1.8 and self.numberOfUnitsInTeam(withTag='rsRaidFleet', greaterThan=7, withinRange=180))) and globalSearchForFirstUnit(withTag='rsEconomicTarget', relation='enemy') != null
price: credits=9000, strategic=12
buildSpeed: 20s
allowMultipleInQueue: false
takeResources: credits=0
takeResources_includeUnitsWithinRange: 180
takeResources_includeUnitsWithinRange_team: own
takeResources_excludeUnitsWithoutTags: rsRaidFleet
takeResources_searchOnly: true
takeResources_maxUnits: 12
takeResources_triggerActionForEach: sendRaidFleet
addActionCooldownTime: 150s
addAllActionCooldownsTime: 150s

[hiddenAction_sendRaidFleet]
sendMessageTo: thisActionTarget
sendMessageWithTags: rsQuantumRaid
sendMessageWithData: target=globalSearchForFirstUnit(withTag='rsEconomicTarget', relation='enemy')

[graphics]
scaleImagesTo: 96
image: quantum_catapult.png
image_wreak: quantum_catapult_dead.png
