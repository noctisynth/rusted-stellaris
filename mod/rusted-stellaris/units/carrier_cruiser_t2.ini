[core]
copyFrom: carrier_cruiser.ini
name: rsCarrierCruiserT2
displayText: 航母巡洋舰 T2
displayDescription: 可持续补充舰载机，主炮与副炮可自卫，具备护盾和自修，不具备导弹近防。
price: credits=5300, alloys=270, science=100
maxHp: 4350
maxShield: 1000
shieldRegen: 0.18
shieldRenderRadius: 28
selfRegenRate: 0.1
tags: rsQuantumFleet, rsRaidFleet, rsTier2

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=5002)
setUnitStats: hp=self.hp*5002/self.maxHp, maxHp=5002
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*4350/self.maxHp, maxHp=4350
addResources: unsetFlag=1

[action_upgradeCruiserT2]
isVisible: false

[graphics]
scaleImagesTo: 64
image: carrier_cruiser.png
image_wreak: carrier_cruiser_dead.png
