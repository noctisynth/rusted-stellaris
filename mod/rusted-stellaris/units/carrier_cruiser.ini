[core]
copyFrom: cruiser.ini
name: rsCarrierCruiser
displayText: 航母巡洋舰
displayDescription: 舰载机投送平台，可持续补充攻击艇，主炮和副炮可自卫，不具备导弹近防。
price: credits=4200, alloys=200
maxHp: 3400
techLevel: 3
buildSpeed: 0.00067
canBuild_1_name: rsStrikeCraft
canBuild_1_pos: 1
canBuild_2_name: setRally
canBuild_2_pos: 0.1

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=3910)
setUnitStats: hp=self.hp*3910/self.maxHp, maxHp=3910
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*3400/self.maxHp, maxHp=3400
addResources: unsetFlag=1

[action_upgradeCruiserT2]
convertTo: rsCarrierCruiserT2

[graphics]
scaleImagesTo: 64
image: carrier_cruiser.png
image_wreak: carrier_cruiser_dead.png

[attack]
maxAttackRange: 200
shootDelay: 58

[projectile_1]
directDamage: 95

[movement]
moveSpeed: 1.45
