[core]
copyFrom: planet_arms03.ini
name: rsPlanetArms03Occupied
displayText: 三臂-03 · 东环（已殖民）
displayDescription: 编号 Arms03 的殖民行星，控制者是邻近殖民地所属队伍。
tags: rsPlanetIntact, rsPlanetOccupied, rsPlanetArms03

[graphics]
image: planet_occupied.png

[action_markOccupied]
autoTrigger: false

[action_markUnclaimed]
autoTrigger: if nearestUnit(withinRange=48, withTag='rsPlanetColony', relation='any', incompleteBuildings=false) == null
convertTo: rsPlanetArms03

[hiddenAction_neutronSweep]
autoTriggerOnEvent: tookDamage(withTag='rsNeutronSweep')
showMessageToAllPlayers: 三臂-03 · 东环上空的中子羽流正在散去。殖民地已被清除，行星仍可重新殖民。
convertTo: rsPlanetArms03
takeResources: credits=0
takeResources_includeUnitsWithinRange: 48
takeResources_includeUnitsWithinRange_team: any
takeResources_excludeUnitsWithoutTags: rsPlanetColony
takeResources_searchOnly: true
takeResources_triggerActionForEach: purgeColony
