[core]
copyFrom: _mining_station_common.ini
name: rsMiningStationT2
displayText: 采矿站 T2
displayDescription: 在矿点上每周期产出 8 矿物。
price: credits=1500, minerals=40, science=40
maxHp: 900
techLevel: 2
generation_resources: minerals=8

[action_upgradeMining]
text: 升级采矿站 T3
description: 在原址提高矿物产量。
price: credits=1900, minerals=100, alloys=60, science=120
buildSpeed: 60s
displayType: upgrade
convertTo: rsMiningStationT3
isLocked: if not self.globalTeamTags(includes='rsTechCruiser')
