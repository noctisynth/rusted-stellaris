ai_isHighPriority: true

[action_applyProcessingBonus]
autoTrigger: if self.numberOfUnitsInTeam(withTag='rsMineralPlant', greaterThan=0)
convertTo: rsMiningStationT2Boosted

[ai]
upgradedFrom: rsMiningStation

[graphics]
scaleImagesTo: 48
image: mining_station.png
image_wreak: mining_station_dead.png
