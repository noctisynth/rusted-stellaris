[core]
copyFrom: battleship.ini
name: rsBattleshipT2
displayText: 战列舰 T2
displayDescription: 重型激光主炮与强化近卫炮可反击小舰，具备护盾和自修，激光防御消耗储能拦截导弹。
price: credits=9300, alloys=500, science=160
maxHp: 8200
maxShield: 3000
shieldRegen: 0.24
shieldRenderRadius: 36
selfRegenRate: 0.15
energyMax: 1
energyRegen: 0.0006
tags: rsQuantumFleet, rsRaidFleet, rsTier2

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=9430)
setUnitStats: hp=self.hp*9430/self.maxHp, maxHp=9430, shootDamageMultiplier=1.1
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*8200/self.maxHp, maxHp=8200, shootDamageMultiplier=1
addResources: unsetFlag=1

[action_upgradeBattleshipT2]
isVisible: false

[graphics]
scaleImagesTo: 80
image: battleship.png
image_wreak: battleship_dead.png

[attack]
shootDelay: 90

[turret_2]
delay: 10

[turret_3]
delay: 10

[projectile_1]
directDamage: 850

[projectile_3]
directDamage: 125

[turret_laserDefence]
x: 0
y: 0
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.25
limitingRange: 160
size: 1
