# Text is generated from locales/*.json; run tools/localization.py --write.
[core]
copyFrom: battleship_missile.ini
name: rsMissileBattleshipT2
displayText: Missile Battleship T2
displayText_zh: 导弹战列舰 T2
displayText_en: Missile Battleship T2
displayDescription: Fires three long-range missiles per salvo with twin secondary guns. Missiles can be intercepted. Shields and self-repair improve survival; laser defenses intercept only a few missiles.
displayDescription_zh: 三发远程导弹齐射并配备双联副炮，导弹可被拦截，护盾和自修增强生存，激光防御只能拦截少量导弹。
displayDescription_en: Fires three long-range missiles per salvo with twin secondary guns. Missiles can be intercepted. Shields and self-repair improve survival; laser defenses intercept only a few missiles.
price: credits=9800, alloys=540, science=160
maxHp: 7600
maxShield: 3000
shieldRegen: 0.24
shieldRenderRadius: 36
selfRegenRate: 0.15
energyMax: 1
energyRegen: 0.0006
tags: rsQuantumFleet, rsRaidFleet, rsTier2

[hiddenAction_academyTraining]
autoTrigger: if self.tags(includes='rsConstructionComplete') and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') != null and (not self.hasFlag(id=1) or self.maxHp!=8740)
setUnitStats: hp=self.hp*8740/self.maxHp, maxHp=8740
addResources: setFlag=1

[hiddenAction_revokeAcademyTraining]
autoTrigger: if self.hasFlag(id=1) and globalSearchForFirstUnit(withTag='rsFleetAcademyActive', relation='own') == null
setUnitStats: hp=self.hp*7600/self.maxHp, maxHp=7600
addResources: unsetFlag=1

[action_upgradeBattleshipT2]
isVisible: false

[graphics]
scaleImagesTo: 80
image: battleship_missile.png
image_wreak: battleship_missile_dead.png

[turret_2]
delay: 10

[turret_3]
delay: 10

[projectile_3]
directDamage: 125

[turret_laserDefence]
x: 0
y: 0
canShoot: false
invisible: true
laserDefenceEnergyUse: 0.25
limitingRange: 160
size: 1
