name: Quality

on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-ci.txt
      - run: python tools/validate_mod.py
      - run: python tools/validate_maps.py
      - name: Check source tree hygiene
        shell: bash
        run: |
          ignored_tracked=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored_tracked" ]; then
            printf 'Ignored build artifacts are tracked:\n%s\n' "$ignored_tracked"
            exit 1
          fi
          git diff --exit-code

  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-ci.txt
            tools/music/requirements.txt
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install -r tools/requirements-ci.txt -r tools/music/requirements.txt
      - name: Cache pinned CC0 samples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/music/astra/samples
          key: cc0-samples-v1-${{ hashFiles('tools/music/sample_provenance.json') }}
      - name: Render and verify all four tracks
        run: python tools/build_music.py
      - name: Package mod and verify archive contents
        run: python tools/build_mod.py
      - name: Verify package provenance
        run: python tools/verify_release.py
      - name: Check source files remain unchanged
        run: git diff --exit-code
      - name: Upload installable development package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rusted-stellaris-${{ github.sha }}
          path: |
            build/rusted-stellaris-dev.rwmod
            build/SHA256SUMS.txt
            build/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
