name: Semifold Status

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - run: uv lock --check
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@9dc3b2e2f25d5db332322b29c3d3436c857ca1d9
        with:
          version: '0.3.4'
      # The status command enters its PR-comment path whenever GITHUB_ACTIONS is set.
      # Keep this preview read-only, including for the Semifold-generated release PR.
      - run: env -u GITHUB_ACTIONS semifold status
      - run: semifold version --dry-run
