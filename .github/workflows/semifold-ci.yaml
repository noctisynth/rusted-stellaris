name: Semifold CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semifold-main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yaml
  release:
    name: Version or Publish
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.semifold.outputs['semifold-version'] }}
      publish: ${{ steps.semifold.outputs['semifold-publish'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rusted-stellaris-${{ github.sha }}
          path: build
      - name: Verify release assets match this commit and version
        run: uv run --locked python tools/verify_release.py
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@9dc3b2e2f25d5db332322b29c3d3436c857ca1d9
        with:
          version: '0.3.4'
      - name: Semifold CI
        id: semifold
        run: semifold ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  steam-workshop:
    name: Update Steam Workshop
    needs: release
    if: >-
      needs.release.outputs.publish != '' &&
      fromJSON(needs.release.outputs.publish).dry-run == false &&
      fromJSON(needs.release.outputs.publish).packages[0].package == 'rusted-stellaris' &&
      fromJSON(needs.release.outputs.publish).packages[0].status == 'succeeded'
    uses: ./.github/workflows/steam-workshop-upload.yaml
    with:
      release_tag: ${{ format('rusted-stellaris-v{0}', fromJSON(needs.release.outputs.publish).packages[0].version) }}
      expected_commit: ${{ github.sha }}
    secrets: inherit
