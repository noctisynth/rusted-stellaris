name: Semifold CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semifold-main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yaml
  release:
    name: Version or Publish
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.semifold.outputs['semifold-version'] }}
      publish: ${{ steps.semifold.outputs['semifold-publish'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rusted-stellaris-${{ github.sha }}
          path: build
      - name: Verify release assets match this commit and version
        run: uv run --locked python tools/verify_release.py
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@9dc3b2e2f25d5db332322b29c3d3436c857ca1d9
        with:
          version: '0.3.4'
      - name: Semifold CI
        id: semifold
        run: semifold ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  steam-workshop:
    name: Update Steam Workshop
    needs: release
    if: >-
      needs.release.outputs.publish != '' &&
      fromJSON(needs.release.outputs.publish).dry-run == false &&
      fromJSON(needs.release.outputs.publish).packages[0].package == 'rusted-stellaris' &&
      fromJSON(needs.release.outputs.publish).packages[0].status == 'succeeded'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Check release tag targets this commit
        id: current
        env:
          RELEASE_VERSION: ${{ fromJSON(needs.release.outputs.publish).packages[0].version }}
        shell: bash
        run: |
          release_tag="rusted-stellaris-v${RELEASE_VERSION}"
          git fetch --no-tags --depth=1 origin "refs/tags/$release_tag:refs/tags/$release_tag"
          if [ "$(git rev-list -n 1 "$release_tag")" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download published release assets
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ fromJSON(needs.release.outputs.publish).packages[0].version }}
        shell: bash
        run: |
          release_tag="rusted-stellaris-v${RELEASE_VERSION}"
          test "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" = false
          mkdir -p build
          gh release download "$release_tag" --dir build \
            --pattern rusted-stellaris-dev.rwmod --pattern SHA256SUMS.txt --pattern BUILD-INFO.txt
      - name: Verify and stage the existing Workshop item
        if: steps.current.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ fromJSON(needs.release.outputs.publish).packages[0].version }}
        run: uv run --locked python tools/prepare_workshop.py --change-note "rusted-stellaris-v${RELEASE_VERSION}"
      - name: Install Valve SteamCMD
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lib32gcc-s1
          mkdir -p build/steamcmd
          curl --fail --location --silent --show-error \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o build/steamcmd/steamcmd_linux.tar.gz
          tar -xzf build/steamcmd/steamcmd_linux.tar.gz -C build/steamcmd
      - name: Update Workshop item 3813493737
        if: steps.current.outputs.publish == 'true'
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF_BASE64: ${{ secrets.STEAM_CONFIG_VDF_BASE64 }}
        shell: bash
        run: |
          test -n "$STEAM_USERNAME"
          test -n "$STEAM_CONFIG_VDF_BASE64"
          mkdir -p build/steamcmd/config
          printf '%s' "$STEAM_CONFIG_VDF_BASE64" | base64 --decode > build/steamcmd/config/config.vdf
          chmod 600 build/steamcmd/config/config.vdf
          cd build/steamcmd
          ./steamcmd.sh +login "$STEAM_USERNAME" \
            +workshop_build_item "$GITHUB_WORKSPACE/build/workshop/workshop.vdf" +quit
