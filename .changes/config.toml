[branches]
base = "main"
release = "release"

[tags]
chore = "Chores"
feat = "New Features"
fix = "Bug Fixes"
perf = "Performance Improvements"
refactor = "Refactors"

[packages.rusted-stellaris]
path = "."
resolver = "python"
publish = false
github-release = true
assets = [
  "build/rusted-stellaris-dev.rwmod",
  "build/SHA256SUMS.txt",
  "build/BUILD-INFO.txt",
]

# Version the Python tooling project; distribute only the mod on GitHub.
[resolver.python]
publish = []

[[resolver.python.post-version]]
command = "uv"
args = ["lock"]
dry-run = false
